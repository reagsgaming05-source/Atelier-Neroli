<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Compta Blonay</title>
<style>
  @font-face { font-family: "Inter Variable"; font-weight: 100 900; font-display: swap; src: url(app/fonts/inter-latin-wght-normal.woff2) format("woff2-variations"); }
  html, body { margin: 0; height: 100%; background: #0f172a; font-family: "Inter Variable", Inter, "Segoe UI", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .bar { display: flex; align-items: center; height: 46px; box-sizing: border-box; padding: 0 12px 0 8px; gap: 16px; color: #e2e8f0; -webkit-app-region: no-drag; }
  .tabs { display: flex; gap: 4px; background: rgba(255,255,255,.07); padding: 3px; border-radius: 11px; flex: none; }
  .tab { border: 0; background: transparent; color: #cbd5e1; height: 32px; padding: 0 12px 0 5px; border-radius: 8px; font: inherit; font-size: 13.5px; font-weight: 550; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .12s, color .12s; white-space: nowrap; }
  .tab .mark { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: linear-gradient(135deg, #2457d6, #5b8def); color: #fff; flex: none; }
  .tab .mark.dgeo { background: linear-gradient(135deg, #6d28d9, #8b5cf6); }
  .tab svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab:hover { background: rgba(255,255,255,.1); color: #fff; }
  .tab:focus-visible { outline: 2px solid #93b4ff; outline-offset: 1px; }
  .tab.active { background: #fff; color: #0f172a; box-shadow: 0 1px 2px rgba(0,0,0,.25); cursor: default; }
  .tab .st { font-weight: 400; font-size: 12px; opacity: .75; }
  .tab .st:empty { display: none; }
  /* décomptes terminés dans Décompte DGEO dont la pièce attend dans la caisse : même violet que Décompte DGEO */
  .tab .badge { background: #7c3aed; color: #fff; padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 11.5px; }
  .tab .badge:empty { display: none; }
  .spacer { flex: 1; min-width: 8px; }
  /* où sont les données : un bouton, qui mène à « L'année → Où sont les données » */
  .donnees { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 55vw; border: 1px solid transparent; background: transparent; color: #94a3b8; font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 8px; cursor: pointer; }
  .donnees span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .donnees svg { width: 14px; height: 14px; flex: none; stroke: #4ade80; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .donnees:hover { background: rgba(255,255,255,.08); color: #e2e8f0; }
  .donnees:focus-visible { outline: 2px solid #93b4ff; }
  .donnees.partage svg { stroke: #93b4ff; }
  .donnees.separee { background: #f59e0b; color: #1f2937; font-weight: 600; }
  .donnees.separee svg { stroke: #1f2937; }
  .donnees.separee:hover { background: #fbbf24; color: #1f2937; }
</style></head>
<body>
  <nav class="bar">
    <!-- Les deux outils de la fenêtre, toujours visibles : le passage de l'un à l'autre ne doit
         pas se deviner dans un logo. L'outil ouvert est en blanc. -->
    <div class="tabs" role="tablist" aria-label="Outils de Compta Blonay">
      <button type="button" class="tab active" data-outil="caisse" role="tab" aria-selected="true" title="Caisse écoles : pièces comptables, journal, comptage de la caisse, fichier Excel">
        <span class="mark"><svg viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>
        <span>Caisse écoles</span><span class="badge" id="badgeCaisse"></span>
      </button>
      <button type="button" class="tab" data-outil="dgeo" role="tab" aria-selected="false" title="Décompte DGEO : décomptes des courses d'école et des camps">
        <span class="mark dgeo"><svg viewBox="0 0 24 24"><path d="m12 2 8.5 4.5L12 11 3.5 6.5 12 2z"/><path d="m3.5 11.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></svg></span>
        <span>Décompte DGEO</span><span class="st" id="etatDgeo"></span>
      </button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="donnees" id="donnees" title="Rien n'est envoyé sur Internet.">
      <svg viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      <span id="donneesTexte"></span>
    </button>
  </nav>
  <script>
    const S = window.CaisseShell;
    const ETAT_DGEO = { starting: 'démarre…', off: 'arrêté', failed: 'ne répond pas', missing: 'non inclus' };
    function appliquer(st) {
      if (!st) return;
      const outil = st.outil || st.active;
      for (const b of document.querySelectorAll('.tab')) {
        const actif = b.dataset.outil === outil;
        b.classList.toggle('active', actif);
        b.setAttribute('aria-selected', actif ? 'true' : 'false');
      }
      const n = Number(st.decomptes) || 0;
      const badge = document.getElementById('badgeCaisse');
      badge.textContent = n ? `${n} décompte${n > 1 ? 's' : ''} à saisir` : '';
      badge.title = n ? 'Décompte terminé dans Décompte DGEO : sa pièce DECOMPTE attend dans Saisie des pièces (« Créer la pièce »).' : '';
      document.getElementById('etatDgeo').textContent = st.hasDgeo === false ? ETAT_DGEO.missing : (ETAT_DGEO[st.dgeo] || '');
      const d = st.donnees;
      const el = document.getElementById('donnees');
      if (d) {
        el.className = `donnees ${d.genre}`;
        document.getElementById('donneesTexte').textContent = d.texte;
        el.title = `${d.titre}\nCliquer : L'année → Où sont les données.`;
      }
    }
    for (const b of document.querySelectorAll('.tab')) b.addEventListener('click', () => S.show(b.dataset.outil));
    document.getElementById('donnees').addEventListener('click', () => S.donnees());
    S.onState(appliquer);
    S.state().then(appliquer).catch(() => {});
  </script>
</body></html>
