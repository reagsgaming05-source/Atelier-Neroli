<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Compta Blonay</title>
<style>
  @font-face { font-family: "Inter Variable"; font-weight: 100 900; font-display: swap; src: url(app/fonts/inter-latin-wght-normal.woff2) format("woff2-variations"); }
  html, body { margin: 0; height: 100%; background: #0f172a; font-family: "Inter Variable", Inter, "Segoe UI", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .bar { display: flex; align-items: center; height: 46px; box-sizing: border-box; padding: 0 14px 0 12px; gap: 16px; color: #e2e8f0; -webkit-app-region: no-drag; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14px; color: #fff; letter-spacing: -0.01em; }
  .brand .mark { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #2457d6, #5b8def); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; box-shadow: 0 4px 10px -4px rgba(36,87,214,.9); }
  .tabs { display: flex; gap: 3px; background: rgba(255,255,255,.07); padding: 3px; border-radius: 10px; }
  .tab { border: 0; background: transparent; color: #cbd5e1; height: 30px; padding: 0 13px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .12s, color .12s; }
  .tab svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .tab:hover { background: rgba(255,255,255,.1); color: #fff; }
  .tab.active { background: #fff; color: #0f172a; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .tab .st { font-weight: 400; font-size: 11.5px; opacity: .7; }
  .tab .badge { background: #f59e0b; color: #1f2937; padding: 1px 8px; border-radius: 999px; font-weight: 600; font-size: 11px; opacity: 1; }
  .tab .badge:empty { display: none; }
  .spacer { flex: 1; }
  .local { display: inline-flex; align-items: center; gap: 7px; color: #94a3b8; font-size: 12px; }
  .local svg { width: 14px; height: 14px; stroke: #4ade80; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
  <nav class="bar">
    <div class="brand"><span class="mark">CB</span><span>Compta Blonay</span></div>
    <div class="tabs">
      <button class="tab active" data-tab="caisse"><svg viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>Caisse écoles <span class="st badge" id="caisseBadge"></span></button>
      <button class="tab" data-tab="dgeo"><svg viewBox="0 0 24 24"><path d="m12 2 8.5 4.5L12 11 3.5 6.5 12 2z"/><path d="m3.5 11.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></svg>Décompte DGEO <span class="st" id="dgeoState"></span></button>
    </div>
    <span class="spacer"></span>
    <span class="local"><svg viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>100 % local · aucune donnée n'est envoyée</span>
  </nav>
  <script>
    const tabs = document.querySelectorAll('.tab');
    const setActive = (name) => tabs.forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
    tabs.forEach((t) => t.addEventListener('click', () => { setActive(t.dataset.tab); window.CaisseShell.show(t.dataset.tab); }));
    const DGEO_STATE = { starting: '(démarre…)', ready: '', off: '(arrêté – cliquer pour relancer)', failed: '(ne répond pas – cliquer pour réessayer)', missing: '(non inclus)' };
    const apply = (s) => {
      setActive(s.active);
      document.getElementById('dgeoState').textContent = s.hasDgeo ? (DGEO_STATE[s.dgeo] || '') : DGEO_STATE.missing;
      const n = s.decomptes || 0;
      document.getElementById('caisseBadge').textContent = n ? `${n} décompte${n > 1 ? 's' : ''} à saisir` : '';
    };
    window.CaisseShell.onState(apply);
    window.CaisseShell.state().then(apply);
  </script>
</body></html>
