name: Blonay PDF – Windows et Mac

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["outils/**", ".github/workflows/build-blonaypdf-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # De bout en bout, sur Linux : l'application entière pilotée dans Chromium,
  # sur la page hors ligne, sans réseau. Rapide, et c'est elle qui garde les
  # promesses lourdes — un mot caviardé qui quitte vraiment le fichier, un
  # sommaire de dossier à jour dans le PDF enregistré.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dépendances
        working-directory: outils
        run: npm ci

      - name: Bibliothèques de la page (pdf.js, pdf-lib, JSZip, depuis npm)
        working-directory: outils
        run: npm run libs

      - name: Application autonome (la suite teste ce que la source produit)
        working-directory: outils
        run: npm run build

      - name: Dépendances de la suite
        working-directory: outils/test-e2e
        run: npm ci

      - name: Navigateur de la suite (mis en cache d'une fois sur l'autre)
        id: navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('outils/test-e2e/package-lock.json') }}

      - name: Chromium
        working-directory: outils/test-e2e
        run: npx playwright install --with-deps chromium

      # La suite de caviardage regarde le fichier produit avec des outils qui ne
      # sont pas les nôtres : poppler (pdftotext), qpdf et pikepdf. Un verdict
      # rendu par le code qu'on teste ne prouve rien. Sans eux elle ÉCHOUE en CI
      # au lieu de se taire.
      - name: Outils de vérification du caviardage (poppler, qpdf, pikepdf)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pikepdf
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Suite de bout en bout
        working-directory: outils/test-e2e
        run: npm test

      # Le mode d'emploi se refait depuis l'application elle-même : ses captures
      # sont prises sur la vraie fenêtre, son PDF imprimé par Chromium. Il se
      # fabrique ici, sur Linux, là où il y a déjà un Chromium et un écran
      # virtuel ; les jobs Windows et Mac n'ont qu'à le récupérer. Un guide
      # que la CI ne produit pas vieillit dans un coin et ne part jamais chez le
      # client : c'est ce qui était arrivé.
      - name: Dépendances de l'application fenêtrée (Electron, pour photographier le guide)
        working-directory: outils/desktop
        run: npm ci

      - name: Mode d'emploi (captures de l'application, puis PDF)
        working-directory: outils/guide
        run: |
          set -euo pipefail
          (cd ../desktop && node prepare-app.js)
          export BLONAY_CHROMIUM="$(cd ../test-e2e && node -p "require('@playwright/test').chromium.executablePath()")"
          xvfb-run -a node faire-le-guide.js "$GITHUB_WORKSPACE/Blonay-PDF-mode-d-emploi.pdf"
          test -s "$GITHUB_WORKSPACE/Blonay-PDF-mode-d-emploi.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: mode-d-emploi
          path: Blonay-PDF-mode-d-emploi.pdf
          retention-days: 7

      - name: Rapport (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: outils/test-e2e/playwright-report
          retention-days: 7

  build:
    needs: e2e
    runs-on: windows-latest
    defaults:
      run:
        working-directory: outils
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dépendances
        run: npm ci

      - name: Bibliothèques de la page (pdf.js, pdf-lib, JSZip, depuis npm)
        run: npm run libs

      - name: Tests unitaires
        run: npm test

      - name: Application autonome (source unique → versions livrées)
        run: npm run build

      - name: Dépendances de l'application fenêtrée
        working-directory: outils/desktop
        run: npm ci

      - name: Empaqueter (Electron, dossier portable)
        working-directory: outils/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - uses: actions/download-artifact@v4
        with:
          name: mode-d-emploi
          path: ${{ github.workspace }}/guide

      - name: Assembler le dossier portable
        working-directory: outils/desktop
        shell: pwsh
        run: |
          Rename-Item dist\win-unpacked BlonayPDF
          # Ce que lit un client : le mode d'emploi, la licence, les composants
          # tiers. Le README du dépôt est une page de développeur, pas un
          # LISEZMOI : il n'a rien à faire dans un dossier livré.
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'guide\Blonay-PDF-mode-d-emploi.pdf') dist\BlonayPDF\Mode-d-emploi.pdf
          Copy-Item build\LICENCE.txt dist\BlonayPDF\LICENCE.txt
          Copy-Item build\MENTIONS-TIERCES.txt dist\BlonayPDF\MENTIONS-TIERCES.txt
          Copy-Item build\LISEZMOI-portable.txt dist\BlonayPDF\LISEZMOI-portable.txt
          Copy-Item build\Mettre-a-jour.cmd dist\BlonayPDF\Mettre-a-jour.cmd
          # La fiche de version voyage a la racine du dossier : c'est elle que
          # l'application lit dans un zip pose a cote d'elle pour savoir s'il
          # est plus recent que ce qui tourne. Sans elle, la mise a jour ne se
          # proposerait jamais (maj-test.js tombe alors).
          Copy-Item construction.json dist\BlonayPDF\version.json
          Get-ChildItem dist\BlonayPDF | Select-Object Name, Length

      - name: Test de fumée de l'exécutable (fenêtre, menu, ouverture d'un PDF, imprimantes, export)
        working-directory: outils/desktop
        shell: pwsh
        run: |
          node smoke-test.js dist\BlonayPDF\BlonayPDF.exe
          Remove-Item dist\BlonayPDF\data -Recurse -Force -ErrorAction SilentlyContinue

      # Les comptes : deux personnes sur la meme installation, chacune ses
      # tampons. Joue sur l'executable empaquete, parce que le dossier de
      # donnees se fixe au tout debut du demarrage et qu'une erreur la ne se
      # verrait qu'en production.
      #
      # Le dossier d'essai est un dossier local ordinaire : rien ne le fait
      # passer pour un lecteur reseau. C'est le defaut qu'on a corrige — la
      # connexion ne s'ouvrait que sur un partage reconnu, et une installation
      # posee ailleurs ne demandait jamais rien a personne.
      - name: Comptes — la connexion d'abord, puis chacune ses tampons
        working-directory: outils/desktop
        shell: pwsh
        run: node comptes-test.js dist\BlonayPDF\BlonayPDF.exe

      # Deux secrétaires, un fichier sur le lecteur réseau : la seconde à
      # enregistrer écrasait le travail de la première sans un mot, et la
      # fenêtre de la première affichait toujours « Enregistré ». Deux instances
      # de l'exécutable empaqueté sur un même document : verrou, conflit,
      # annulation, écrasement voulu, et aucun verrou qui traîne à la fermeture.
      - name: Écrasement — le travail d'une collègue n'est jamais perdu en silence
        working-directory: outils/desktop
        shell: pwsh
        run: node ecrasement-test.js dist\BlonayPDF\BlonayPDF.exe

      # « Aucune donnée ne quitte le poste » se prouve en regardant, pas en
      # relisant le code. Un mandataire d'observation est posé sur la machine,
      # l'exécutable empaqueté est utilisé pour de bon (ouvrir, tourner,
      # enregistrer, reconnaître le texte d'une image) et le test échoue à la
      # moindre connexion reçue ou à la moindre requête refusée. Il a déjà
      # débusqué un téléchargement de dictionnaire orthographique chez Google.
      - name: Réseau — rien ne sort du poste, observé derrière un mandataire
        working-directory: outils/desktop
        shell: pwsh
        run: node reseau-test.js dist\BlonayPDF\BlonayPDF.exe

      # Une mise a jour qui se propose a tort reinstalle une version plus
      # ancienne ; lancee pendant qu'une collegue travaille, elle laisse une
      # installation a moitie remplacee. Les quatre cas sont joues sur
      # l'executable empaquete.
      - name: Mise à jour — proposée, refusée quand une collègue travaille, lancée sinon
        working-directory: outils/desktop
        shell: pwsh
        run: |
          node maj-test.js dist\BlonayPDF\BlonayPDF.exe
          Remove-Item dist\BlonayPDF\data -Recurse -Force -ErrorAction SilentlyContinue

      - name: Archive zip
        working-directory: outils/desktop
        shell: pwsh
        run: Compress-Archive -Path dist\BlonayPDF -DestinationPath ..\..\BlonayPDF-windows.zip

      # Les zips des tests sont ecrits a la main. Celui-ci vient de
      # Compress-Archive : c'est la seule preuve que le lecteur de zip tient
      # devant l'archive que les gens telechargeront vraiment.
      # Le script node est dans une chaine PowerShell a guillemets doubles :
      # pas d'apostrophe dedans, elle y serait rendue telle quelle et couperait
      # la chaine JavaScript en deux.
      - name: La fiche de version se lit dans l'archive
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'BlonayPDF-windows.zip'
          $mod = Join-Path $env:GITHUB_WORKSPACE 'outils\desktop\version-posee.js'
          $lu = node -e "const v = require(process.argv[1]).ficheDuZip(process.argv[2]); if (!v || !v.commit || !v.date) { console.error('fiche de version illisible dans le zip'); process.exit(1); } console.log(v.commit + ' du ' + v.date);" $mod $zip
          if ($LASTEXITCODE -ne 0) { throw "La fiche de version ne se lit pas dans l'archive." }
          Write-Host "  fiche lue dans l'archive : $lu"

      # Le script de mise a jour est la seule chose du depot qui touche a
      # l'installation de quelqu'un. Il est donc joue pour de vrai, sur Windows :
      # un faux dossier deja installe, avec des donnees dedans, recoit le zip
      # fraichement construit. Ce qui compte : data survit, l'executable est
      # remplace, et un fichier personnel pose dans le dossier reste la.
      - name: Le script de mise à jour préserve les données
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Capture fidèle : sans cela, les accents du script reviendraient
          # abîmés par la console et la vérification ne voudrait rien dire.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $poste = Join-Path $env:RUNNER_TEMP 'poste'
          New-Item -ItemType Directory -Force -Path (Join-Path $poste 'data\recuperation') | Out-Null
          Set-Content (Join-Path $poste 'data\tampons.json') 'MES TAMPONS'
          Set-Content (Join-Path $poste 'data\recuperation\a.json') 'MON TRAVAIL'
          Set-Content (Join-Path $poste 'BlonayPDF.exe') 'VIEILLE VERSION'
          Set-Content (Join-Path $poste 'notes-du-service.txt') 'A MOI'
          # Le job travaille dans outils/ : chemins absolus depuis l'espace de travail.
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'outils\desktop\build\Mettre-a-jour.cmd') $poste

          $sortie = & cmd.exe /c "`"$poste\Mettre-a-jour.cmd`" `"$env:GITHUB_WORKSPACE\BlonayPDF-windows.zip`" < NUL" 2>&1 | Out-String
          Write-Host $sortie

          $dit = { param($quoi, $vrai) if (-not $vrai) { throw "RATÉ : $quoi" }; Write-Host "  ok - $quoi" }
          & $dit 'le script est allé au bout' ($sortie -match 'BLONAY-MAJ: OK')
          & $dit 'les accents ressortent intacts' ($sortie -match 'Mise à jour terminée')
          & $dit 'les tampons sont conservés' ((Get-Content (Join-Path $poste 'data\tampons.json')) -eq 'MES TAMPONS')
          & $dit 'le travail mis de côté est conservé' ((Get-Content (Join-Path $poste 'data\recuperation\a.json')) -eq 'MON TRAVAIL')
          & $dit 'un fichier personnel du dossier est conservé' ((Get-Content (Join-Path $poste 'notes-du-service.txt')) -eq 'A MOI')
          & $dit 'l''exécutable a bien été remplacé' ((Get-Item (Join-Path $poste 'BlonayPDF.exe')).Length -gt 1000000)
          & $dit 'le LISEZMOI portable est arrivé' (Test-Path (Join-Path $poste 'LISEZMOI-portable.txt'))
          & $dit 'le script s''est mis à jour lui-même' (Test-Path (Join-Path $poste 'Mettre-a-jour.cmd'))

          # Lancée par l'application elle-même, la mise à jour ne s'arrête pas sur
          # un « appuyez sur une touche » : elle attend que la fenêtre se ferme,
          # puis rouvre l'application. Sans quoi la personne se retrouverait
          # devant une console, sans son logiciel.
          # Dans un fichier, pas dans un tuyau : l'application que la mise à jour
          # rouvre hériterait de la sortie, et PowerShell attendrait la fermeture
          # du tuyau — donc celle de l'application. Le premier essai y est resté.
          $env:BLONAY_MAJ_AUTO = '1'
          $journal = Join-Path $env:RUNNER_TEMP 'maj-auto.txt'
          cmd.exe /c "`"$poste\Mettre-a-jour.cmd`" `"$env:GITHUB_WORKSPACE\BlonayPDF-windows.zip`" > `"$journal`" 2>&1 < NUL"
          Remove-Item Env:\BLONAY_MAJ_AUTO
          $auto = Get-Content $journal -Raw -Encoding utf8
          Write-Host $auto
          & $dit 'la mise à jour automatique va au bout' ($auto -match 'BLONAY-MAJ: OK')
          & $dit 'elle rouvre l''application au lieu d''attendre une touche' ($auto -match 'Redémarrage de l''application')
          # Elle vient d'ouvrir une fenêtre sur le runner : on la referme.
          Start-Sleep -Seconds 5
          taskkill /F /IM BlonayPDF.exe /T 2>$null | Out-Null
          Start-Sleep -Seconds 2
          Remove-Item -Recurse -Force $poste -ErrorAction SilentlyContinue

      # upload-artifact@v4 et action-gh-release@v2 ciblent encore Node 20 : le
      # runner les force sur Node 24 et prévient à chaque exécution. Rien n'est
      # cassé aujourd'hui ; à passer au majeur suivant dès qu'il sort.
      - uses: actions/upload-artifact@v4
        with:
          name: BlonayPDF-windows
          path: BlonayPDF-windows.zip

      - name: Retrouver la version 1 (le zip publié avant les dix ajouts), une seule fois
        id: v1
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view blonaypdf-v1 *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "La release blonaypdf-v1 existe déjà : rien à faire." ; "creer=false" >> $env:GITHUB_OUTPUT ; exit 0 }
          gh release download blonaypdf-windows-latest -p BlonayPDF-windows.zip -O BlonayPDF-v1-windows.zip
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path BlonayPDF-v1-windows.zip)) { throw "Impossible de récupérer le zip de la version 1 depuis blonaypdf-windows-latest." }
          Write-Host ("Zip de la version 1 : " + (Get-Item BlonayPDF-v1-windows.zip).Length + " octets")
          "creer=true" >> $env:GITHUB_OUTPUT

      - name: Conserver la version 1 (release « blonaypdf-v1 »)
        if: github.event_name == 'push' && steps.v1.outputs.creer == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Le tag blonaypdf-v1 existe déjà dans le dépôt (posé sur le commit 0ed7dac) :
          # la release s'y attache sans avoir à créer de tag.
          tag_name: blonaypdf-v1
          name: "Blonay PDF — version 1 (avant les dix ajouts)"
          prerelease: false
          body: |
            Version conservée telle quelle : l'application portable Windows avant les dix ajouts de la version 2
            (signets, tampons mémorisés, commentaires PDF, dossier de pièces, tableau vers Excel, remplacer partout,
            traitement par lots, onglets, OCR, comparaison). Décompressez `BlonayPDF-v1-windows.zip` puis lancez `BlonayPDF.exe`.
            Construite depuis le commit 0ed7dac.
          files: outils/BlonayPDF-v1-windows.zip

      # Le zip fait 120 Mo, et son téléversement échoue de temps en temps
      # (« Error saving asset »). L'action qui le posait supprimait l'ancien
      # fichier avant d'envoyer le nouveau : un envoi manqué laissait la release
      # sans rien, et les collègues devant un lien mort — c'est arrivé. On pose
      # donc le zip nous-mêmes, en réessayant, et on ne déclare l'étape réussie
      # qu'après avoir vu le fichier en ligne, à la bonne taille.
      - name: Publier la version portable (pré-release « blonaypdf-windows-latest »)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = 'blonaypdf-windows-latest'
          $titre = 'Blonay PDF — Windows portable (dernière version)'
          # Le job travaille dans outils/ ; le zip, lui, est écrit à la racine
          # du dépôt. Chemin absolu, pour ne pas dépendre de l'un ni de l'autre.
          $zip = Join-Path $env:GITHUB_WORKSPACE 'BlonayPDF-windows.zip'
          if (-not (Test-Path $zip)) { throw "Zip introuvable : $zip" }
          # Guillemets simples : le texte contient des accents graves, qui sont
          # le caractère d'échappement de PowerShell dans une chaîne double.
          $notes = @'
          Version portable Windows : décompressez le zip, puis double-cliquez sur `BlonayPDF.exe`.
          Aucune installation, aucun navigateur : tout est inclus (lecture, organisation, correction du texte, annotations, formulaires, impression directe avec livret).
          Version 2 : reconnaissance de texte locale (OCR, français et allemand), dossier de pièces, remplacer et caviarder partout, tableau vers Excel, tampons et signatures mémorisés, traitement par lots, vrais commentaires PDF, comparaison de deux versions, signets et lecture deux pages, onglets.
          La version 1 reste disponible telle quelle dans la release « Blonay PDF — version 1 » (`blonaypdf-v1`).
          Aucune donnée ne quitte le PC. Voir `LISEZMOI-portable.txt` dans le dossier.
          Construit automatiquement depuis le commit ${{ github.sha }}.
          '@

          # L'API de GitHub répond parfois 500 sur ces appels-là. Sans nouvelle
          # tentative, un zip construit et éprouvé reste à quai, et les collègues
          # gardent l'ancienne version sans savoir pourquoi — c'est arrivé.
          $attente = 2
          for ($essai = 1; $essai -le 5; $essai++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release edit $tag --title $titre --notes $notes --prerelease=true
            } else {
              gh release create $tag --title $titre --notes $notes --prerelease
            }
            if ($LASTEXITCODE -eq 0) { break }
            if ($essai -eq 5) { throw "Impossible de préparer la release $tag après cinq tentatives." }
            Write-Host "Préparation manquée (tentative $essai). Nouvelle tentative dans $attente s."
            Start-Sleep -Seconds $attente
            $attente = $attente * 2
          }

          $attente = 2
          for ($essai = 1; $essai -le 5; $essai++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($essai -eq 5) { throw "Le zip n'a pas pu être posé sur $tag après cinq tentatives." }
            Write-Host "Téléversement manqué (tentative $essai). Nouvelle tentative dans $attente s."
            Start-Sleep -Seconds $attente
            $attente = $attente * 2
          }

          $attendu = (Get-Item $zip).Length
          $pose = gh release view $tag --json assets --jq '.assets[] | select(.name == "BlonayPDF-windows.zip") | .size'
          if (-not $pose) { throw "La release $tag n'a pas de zip : le lien de téléchargement serait mort." }
          if ([int64]$pose -ne $attendu) { throw "Le zip posé fait $pose octets au lieu de $attendu." }
          Write-Host "Zip publié : $pose octets."

  # ---------------------------------------------------------------------------
  # La version Mac. Même application, même code : seul l'emballage change.
  #
  # Construite sur un vrai macOS, parce qu'un paquet .app se signe et se
  # compresse avec les outils du système — un zip fabriqué ailleurs perd les
  # liens symboliques des frameworks, et l'application refuse de s'ouvrir.
  #
  # Binaire universel : le même paquet tourne sur les Mac Intel et sur les Mac
  # à puce Apple. Nous n'avons pas de certificat Apple, donc pas de
  # notarisation : le premier lancement demande un clic droit > Ouvrir, ce que
  # LISEZMOI-mac.txt explique.
  # ---------------------------------------------------------------------------
  mac:
    needs: e2e
    runs-on: macos-latest
    defaults:
      run:
        working-directory: outils
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dépendances
        run: npm ci

      - name: Bibliothèques de la page (pdf.js, pdf-lib, JSZip, depuis npm)
        run: npm run libs

      - name: Application autonome (source unique → versions livrées)
        run: npm run build

      - name: Dépendances de l'application fenêtrée
        working-directory: outils/desktop
        run: npm ci

      # Le certificat « Developer ID Application », exporté en .p12 puis encodé
      # en base64 dans les secrets du dépôt. Sans lui, la construction continue
      # et signe « ad hoc » : l'application tourne, mais macOS demandera son
      # accord à chaque poste.
      - name: Certificat de signature (s'il est fourni)
        id: certificat
        env:
          P12: ${{ secrets.MAC_CERTIFICAT_P12 }}
          MOT_DE_PASSE: ${{ secrets.MAC_CERTIFICAT_MOT_DE_PASSE }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            # Rien poser du tout. Un CSC_LINK vide n'est pas « pas de
            # certificat » pour electron-builder : il le prend pour un chemin,
            # le résout sur le dossier du projet et s'arrête sur « not a file ».
            # C'est ce qui a fait échouer la construction Mac.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "signe=non" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucun certificat Apple : signature ad hoc. macOS demandera l'accord de chaque utilisateur."
            exit 0
          fi
          # Le certificat est posé dans un fichier hors du dépôt : le base64
          # tient sur plusieurs lignes, et une valeur multiligne ne traverse pas
          # l'environnement d'une étape à l'autre.
          fichier="$RUNNER_TEMP/certificat.p12"
          # --decode sur le base64 de GNU, -D sur celui de BSD : selon l'image du
          # runner, c'est l'un ou l'autre.
          printf '%s' "$P12" | base64 --decode > "$fichier" 2>/dev/null \
            || printf '%s' "$P12" | base64 -D > "$fichier" 2>/dev/null \
            || { echo "::error::MAC_CERTIFICAT_P12 n'est pas du base64 : exportez le .p12 puis « base64 -i certificat.p12 | pbcopy »"; exit 1; }
          test -s "$fichier" || { echo "::error::MAC_CERTIFICAT_P12 est vide une fois décodé"; exit 1; }
          echo "CSC_LINK=$fichier" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          # Le mot de passe peut contenir n'importe quoi, y compris un retour à
          # la ligne : il passe par la forme à délimiteur.
          {
            echo "CSC_KEY_PASSWORD<<FIN_DU_MOT_DE_PASSE"
            printf '%s\n' "$MOT_DE_PASSE"
            echo "FIN_DU_MOT_DE_PASSE"
          } >> "$GITHUB_ENV"
          echo "signe=oui" >> "$GITHUB_OUTPUT"
          echo "Certificat fourni : l'application sera signée puis notarisée."

      - name: Empaqueter (Electron, binaire universel)
        working-directory: outils/desktop
        # CSC_LINK, CSC_KEY_PASSWORD et CSC_IDENTITY_AUTO_DISCOVERY viennent de
        # l'étape ci-dessus, qui ne les pose que s'il y a de quoi signer.
        run: npm run dist:mac

      - uses: actions/download-artifact@v4
        with:
          name: mode-d-emploi
          path: ${{ github.workspace }}/guide

      - name: Assembler le dossier
        working-directory: outils/desktop
        run: |
          set -euo pipefail
          # Le dossier de sortie s'appelle mac-universal, mac-arm64 ou mac selon
          # l'architecture : on prend celui qui porte le paquet.
          paquet=$(find dist -maxdepth 2 -name "BlonayPDF.app" -print -quit)
          test -n "$paquet" || { echo "::error::BlonayPDF.app introuvable dans dist/"; exit 1; }
          echo "paquet : $paquet"
          rm -rf dist/BlonayPDF && mkdir -p dist/BlonayPDF
          ditto "$paquet" dist/BlonayPDF/BlonayPDF.app
          # Ce que lit un client : le mode d'emploi, la licence, les composants
          # tiers. Le README du dépôt est une page de développeur.
          cp "$GITHUB_WORKSPACE/guide/Blonay-PDF-mode-d-emploi.pdf" dist/BlonayPDF/Mode-d-emploi.pdf
          cp build/LICENCE.txt dist/BlonayPDF/LICENCE.txt
          cp build/MENTIONS-TIERCES.txt dist/BlonayPDF/MENTIONS-TIERCES.txt
          cp build/LISEZMOI-mac.txt dist/BlonayPDF/LISEZMOI-mac.txt
          cp build/Mettre-a-jour.command dist/BlonayPDF/Mettre-a-jour.command
          chmod +x dist/BlonayPDF/Mettre-a-jour.command
          # La fiche de version voyage à la racine du dossier : c'est elle que
          # l'application lit dans un zip posé à côté d'elle pour savoir s'il est
          # plus récent. Sans elle, la mise à jour ne se proposerait jamais.
          cp construction.json dist/BlonayPDF/version.json
          ls -la dist/BlonayPDF

      - name: L'application est bien universelle, et signée
        working-directory: outils/desktop
        run: |
          set -euo pipefail
          paquet=dist/BlonayPDF/BlonayPDF.app
          binaire=$paquet/Contents/MacOS/BlonayPDF
          file "$binaire"
          for arch in x86_64 arm64; do
            lipo -archs "$binaire" | grep -qw "$arch" || { echo "::error::$arch manque : les Mac correspondants ne pourront pas l'ouvrir"; exit 1; }
          done
          echo "architectures : $(lipo -archs "$binaire")"

          # Sans certificat Apple, une signature « ad hoc » — le tiret à la place
          # d'une identité — reste nécessaire : sans elle, un Mac à puce Apple
          # refuse de lancer le paquet, et ce sont toutes les machines vendues
          # depuis 2020. Le lieur en pose une sur le binaire, jamais sur le
          # paquet : c'est à nous de le faire, une fois tout en place.
          if [ "${{ steps.certificat.outputs.signe }}" != "oui" ]; then
            codesign --force --deep --sign - "$paquet"
          fi
          codesign --verify --deep --strict "$paquet" || { echo "::error::le paquet n'est pas signé"; exit 1; }
          codesign -dv "$paquet" 2>&1 | head -6

      - name: Test de fumée de l'application empaquetée
        working-directory: outils/desktop
        run: |
          set -euo pipefail
          node smoke-test.js dist/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF
          rm -rf dist/BlonayPDF/data

      # La remontée du chemin hors du paquet .app est éprouvée à part, dans les
      # tests unitaires (dossierPortable). Ici, c'est le parcours des comptes
      # qu'on rejoue sur l'application empaquetée pour de vrai.
      - name: Comptes — la connexion d'abord, sur l'application empaquetée
        working-directory: outils/desktop
        run: node comptes-test.js dist/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF

      - name: Écrasement — le travail d'une collègue n'est jamais perdu en silence
        working-directory: outils/desktop
        run: node ecrasement-test.js dist/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF

      - name: Réseau — rien ne sort du poste, observé derrière un mandataire
        working-directory: outils/desktop
        run: node reseau-test.js dist/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF

      # Notariser, c'est soumettre le paquet à Apple, qui l'analyse et rend un
      # « ticket ». Agrafé au paquet, ce ticket permet à n'importe quel Mac de
      # l'ouvrir sans rien demander, même sans connexion — c'est la seule façon
      # d'éviter le clic droit puis « Ouvrir » sur chaque poste.
      #
      # L'agrafage se fait sur le paquet, avant le zip livré : un ticket posé
      # après ne voyagerait pas avec l'application.
      - name: Notariser chez Apple
        if: steps.certificat.outputs.signe == 'oui'
        working-directory: outils/desktop
        env:
          CLE_API: ${{ secrets.MAC_API_CLE_P8 }}
          CLE_ID: ${{ secrets.MAC_API_CLE_ID }}
          CLE_EMETTEUR: ${{ secrets.MAC_API_EMETTEUR }}
        run: |
          set -euo pipefail
          paquet=dist/BlonayPDF/BlonayPDF.app
          cle="$RUNNER_TEMP/cle-api.p8"
          printf '%s' "$CLE_API" | base64 --decode > "$cle"
          trap 'rm -f "$cle"' EXIT

          # Apple veut une archive, pas un dossier.
          ditto -c -k --keepParent "$paquet" "$RUNNER_TEMP/a-notariser.zip"
          xcrun notarytool submit "$RUNNER_TEMP/a-notariser.zip" \
            --key "$cle" --key-id "$CLE_ID" --issuer "$CLE_EMETTEUR" \
            --wait --timeout 30m

          xcrun stapler staple "$paquet"
          xcrun stapler validate "$paquet" || { echo "::error::le ticket de notarisation n'est pas agrafé"; exit 1; }
          # Le verdict tel que le rendra le Mac d'en face.
          spctl -a -vvv -t exec "$paquet"
          echo "Notarisé et agrafé."

      - name: Archive zip
        working-directory: outils/desktop
        run: |
          set -euo pipefail
          # ditto, et non zip : lui seul préserve les liens symboliques des
          # frameworks et les droits d'exécution. Un zip ordinaire produit une
          # application qui ne s'ouvre pas.
          ditto -c -k --sequesterRsrc --keepParent dist/BlonayPDF "$GITHUB_WORKSPACE/BlonayPDF-mac.zip"
          ls -la "$GITHUB_WORKSPACE/BlonayPDF-mac.zip"

      - name: Le zip se décompresse en une application qui s'ouvre
        run: |
          set -euo pipefail
          essai=$(mktemp -d)
          ditto -x -k "$GITHUB_WORKSPACE/BlonayPDF-mac.zip" "$essai"
          test -x "$essai/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF" || { echo "::error::le binaire a perdu son droit d'exécution dans le zip"; exit 1; }
          test -f "$essai/BlonayPDF/version.json" || { echo "::error::la fiche de version manque dans l'archive"; exit 1; }
          test -f "$essai/BlonayPDF/LISEZMOI-mac.txt" || { echo "::error::le LISEZMOI manque"; exit 1; }
          test -x "$essai/BlonayPDF/Mettre-a-jour.command" || { echo "::error::le script de mise à jour n'est pas exécutable"; exit 1; }
          # Les frameworks d'Electron sont pleins de liens symboliques ; s'ils
          # arrivent en copies, l'application pèse le triple et ne démarre pas.
          liens=$(find "$essai/BlonayPDF/BlonayPDF.app" -type l | wc -l | tr -d " ")
          echo "liens symboliques préservés : $liens"
          test "$liens" -gt 0 || { echo "::error::aucun lien symbolique : le paquet est cassé"; exit 1; }
          codesign --verify --deep "$essai/BlonayPDF/BlonayPDF.app" || { echo "::error::la signature n'a pas survécu au zip"; exit 1; }
          if [ "${{ steps.certificat.outputs.signe }}" = "oui" ]; then
            # C'est ici que se joue la promesse faite à l'utilisateur : une
            # application qui s'ouvre d'un double-clic. On la vérifie sur le zip
            # décompressé, c'est-à-dire sur ce qu'il recevra vraiment.
            xcrun stapler validate "$essai/BlonayPDF/BlonayPDF.app" || { echo "::error::le ticket de notarisation n'a pas survécu au zip"; exit 1; }
            spctl -a -vvv -t exec "$essai/BlonayPDF/BlonayPDF.app" || { echo "::error::macOS refuserait d'ouvrir cette application"; exit 1; }
            echo "Notarisation vérifiée sur l'archive livrée."
          fi
          rm -rf "$essai"

      - uses: actions/upload-artifact@v4
        with:
          name: BlonayPDF-mac
          path: BlonayPDF-mac.zip
          retention-days: 14

      - name: Publier la version Mac (pré-release « blonaypdf-mac-latest »)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          tag=blonaypdf-mac-latest
          titre="Blonay PDF — Mac (dernière version)"
          zip="$GITHUB_WORKSPACE/BlonayPDF-mac.zip"
          test -f "$zip" || { echo "::error::zip introuvable"; exit 1; }
          if [ "${{ steps.certificat.outputs.signe }}" = "oui" ]; then
            ouverture='Décompressez le zip et double-cliquez sur `BlonayPDF.app`. Rien d'"'"'autre : l'"'"'application est signée et notarisée par Apple, elle s'"'"'ouvre sur n'"'"'importe quel Mac, y compris un poste d'"'"'entreprise.'
          else
            ouverture='Décompressez le zip, puis **clic droit sur `BlonayPDF.app` > Ouvrir** au premier lancement. Ce clic droit n'"'"'est nécessaire qu'"'"'une fois : cette version n'"'"'est pas notarisée, alors macOS demande votre accord. Voir `LISEZMOI-mac.txt`.'
          fi
          notes=$(cat <<NOTES
          $ouverture
          Binaire universel : Mac Intel et Mac à puce Apple.
          Aucune installation, aucun navigateur : tout est inclus (lecture, organisation, correction du texte, annotations, formulaires, caviardage, OCR, impression avec livret).
          Aucune donnée ne quitte le Mac.
          NOTES
          )
          notes="$notes

          Construit automatiquement depuis le commit ${{ github.sha }}."

          # Même prudence que côté Windows : l'API répond parfois 500.
          attente=2
          for essai in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$titre" --notes "$notes" --prerelease=true && break
            else
              gh release create "$tag" --title "$titre" --notes "$notes" --prerelease && break
            fi
            if [ "$essai" = 5 ]; then echo "::error::impossible de préparer la release $tag après cinq tentatives"; exit 1; fi
            echo "Préparation manquée (tentative $essai). Nouvelle tentative dans ${attente}s."
            sleep "$attente"; attente=$((attente * 2))
          done

          # Le téléversement échoue de temps en temps : on réessaie, et on ne
          # déclare l'étape réussie qu'après avoir vu le fichier en ligne, à la
          # bonne taille. Un lien mort chez les collègues, c'est déjà arrivé.
          attente=2
          for essai in 1 2 3 4 5; do
            if gh release upload "$tag" "$zip" --clobber; then break; fi
            if [ "$essai" = 5 ]; then echo "::error::le zip n'a pas pu être posé après cinq tentatives"; exit 1; fi
            echo "Téléversement manqué (tentative $essai). Nouvelle tentative dans ${attente}s."
            sleep "$attente"; attente=$((attente * 2))
          done

          attendu=$(stat -f %z "$zip")
          pose=$(gh release view "$tag" --json assets --jq '.assets[] | select(.name == "BlonayPDF-mac.zip") | .size')
          test -n "$pose" || { echo "::error::la release n'a pas de zip : le lien serait mort"; exit 1; }
          test "$pose" = "$attendu" || { echo "::error::le zip posé fait $pose octets au lieu de $attendu"; exit 1; }
          echo "Zip publié : $pose octets."
