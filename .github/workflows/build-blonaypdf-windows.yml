name: Blonay PDF – Windows portable

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["outils/**", ".github/workflows/build-blonaypdf-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: outils
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dépendances
        run: npm ci

      - name: Bibliothèques de la page (pdf.js, pdf-lib, JSZip, depuis npm)
        run: npm run libs

      - name: Tests unitaires
        run: npm test

      - name: Application autonome (source unique → versions livrées)
        run: npm run build

      - name: Dépendances de l'application fenêtrée
        working-directory: outils/desktop
        run: npm ci

      - name: Empaqueter (Electron, dossier portable)
        working-directory: outils/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Assembler le dossier portable
        working-directory: outils/desktop
        shell: pwsh
        run: |
          Rename-Item dist\win-unpacked BlonayPDF
          Copy-Item ..\..\README.md dist\BlonayPDF\LISEZMOI.md
          Copy-Item build\LISEZMOI-portable.txt dist\BlonayPDF\LISEZMOI-portable.txt
          Get-ChildItem dist\BlonayPDF | Select-Object Name, Length

      - name: Test de fumée de l'exécutable (fenêtre, menu, ouverture d'un PDF, imprimantes, export)
        working-directory: outils/desktop
        shell: pwsh
        run: |
          node smoke-test.js dist\BlonayPDF\BlonayPDF.exe
          Remove-Item dist\BlonayPDF\data -Recurse -Force -ErrorAction SilentlyContinue

      - name: Archive zip
        working-directory: outils/desktop
        shell: pwsh
        run: Compress-Archive -Path dist\BlonayPDF -DestinationPath ..\..\BlonayPDF-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BlonayPDF-windows
          path: BlonayPDF-windows.zip

      - name: Conserver la version 1 (release « blonaypdf-v1 », créée une seule fois)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view blonaypdf-v1 *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "La release blonaypdf-v1 existe déjà : rien à faire." ; exit 0 }
          gh release download blonaypdf-windows-latest -p BlonayPDF-windows.zip -O BlonayPDF-v1-windows.zip
          if ($LASTEXITCODE -ne 0) { throw "Impossible de récupérer le zip de la version 1 depuis blonaypdf-windows-latest." }
          gh release create blonaypdf-v1 BlonayPDF-v1-windows.zip `
            --target 0ed7dac09ea1b2ac101842bb5de278607ef82a0e `
            --title "Blonay PDF — version 1 (avant les dix ajouts)" `
            --notes "Version conservée telle quelle : l'application portable Windows avant les dix ajouts de la version 2 (signets, tampons mémorisés, annotations PDF, dossier de pièces, copier vers Excel, rechercher-remplacer, traitement par lots, onglets, OCR, comparaison). Décompressez BlonayPDF-v1-windows.zip puis lancez BlonayPDF.exe. Construite depuis le commit 0ed7dac."
          if ($LASTEXITCODE -ne 0) { throw "Création de la release blonaypdf-v1 impossible." }

      - name: Publier la version portable (pré-release « blonaypdf-windows-latest »)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blonaypdf-windows-latest
          name: "Blonay PDF — Windows portable (dernière version)"
          prerelease: true
          body: |
            Version portable Windows : décompressez le zip, puis double-cliquez sur `BlonayPDF.exe`.
            Aucune installation, aucun navigateur : tout est inclus (lecture, organisation, correction du texte, annotations, formulaires, impression directe avec livret).
            Aucune donnée ne quitte le PC. Voir `LISEZMOI-portable.txt` dans le dossier.
            Construit automatiquement depuis le commit ${{ github.sha }}.
          files: BlonayPDF-windows.zip
