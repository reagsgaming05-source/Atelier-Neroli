name: Blonay PDF – Windows et Mac

# Une construction qui sort d'une branche de travail n'est JAMAIS « la dernière
# version » que les postes téléchargent : elle est publiée en version CANDIDATE, à
# essayer d'abord. Seule une version numérotée — étiquette « v2.1.0 », ou lancement
# manuel avec « stable » — passe en STABLE, et reste téléchargeable quand la suivante
# sort. La publication attend que Windows ET Mac soient verts : un poste Windows et
# un poste Mac d'un même secrétariat ne se retrouvent plus sur deux versions.
on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths: ["outils/**", ".github/workflows/build-blonaypdf-windows.yml"]
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier en STABLE (version numérotée, celle que les postes téléchargent)"
        type: choice
        options: ["candidate", "stable"]
        default: "candidate"
      critique:
        description: "Mise à jour IMPORTANTE (correctif de sécurité ou de données) : l'application la présente comme telle"
        type: boolean
        default: false

permissions:
  contents: write

# Deux pushes rapprochés ne se disputent plus la publication : le plus ancien
# s'arrête, sauf pour une version stable, qu'on n'interrompt jamais.
concurrency:
  group: construction-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  # « stable » : une étiquette de version, ou un lancement manuel qui le demande.
  # Tout le reste est candidate. Le build le grave dans la fiche de version et dans
  # l'application ; la suite de tests n'y refait pas de nouvelle tentative (un test
  # instable qui passe au deuxième essai ne doit pas laisser partir une version stable).
  BLONAY_CANAL: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publier == 'stable')) && 'stable' || 'candidate' }}

jobs:
  # De bout en bout, sur Linux : l'application entière pilotée dans Chromium,
  # sur la page hors ligne, sans réseau. Rapide, et c'est elle qui garde les
  # promesses lourdes — un mot caviardé qui quitte vraiment le fichier, un
  # sommaire de dossier à jour dans le PDF enregistré.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dépendances
        working-directory: outils
        run: npm ci

      - name: Bibliothèques de la page (pdf.js, pdf-lib, JSZip, depuis npm)
        working-directory: outils
        run: npm run libs

      - name: Application autonome (la suite teste ce que la source produit)
        working-directory: outils
        run: npm run build

      - name: Dépendances de la suite
        working-directory: outils/test-e2e
        run: npm ci

      - name: Navigateur de la suite (mis en cache d'une fois sur l'autre)
        id: navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('outils/test-e2e/package-lock.json') }}

      - name: Chromium
        working-directory: outils/test-e2e
        run: npx playwright install --with-deps chromium

      # La suite de caviardage regarde le fichier produit avec des outils qui ne
      # sont pas les nôtres : poppler (pdftotext), qpdf et pikepdf. Un verdict
      # rendu par le code qu'on teste ne prouve rien. Sans eux elle ÉCHOUE en CI
      # au lieu de se taire.
      - name: Outils de vérification du caviardage (poppler, qpdf, pikepdf)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pikepdf
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Suite de bout en bout
        working-directory: outils/test-e2e
        run: npm test

      # Le mode d'emploi se refait depuis l'application elle-même : ses captures
      # sont prises sur la vraie fenêtre, son PDF imprimé par Chromium. Il se
      # fabrique ici, sur Linux, là où il y a déjà un Chromium et un écran
      # virtuel ; les jobs Windows et Mac n'ont qu'à le récupérer. Un guide
      # que la CI ne produit pas vieillit dans un coin et ne part jamais chez le
      # client : c'est ce qui était arrivé.
      - name: Dépendances de l'application fenêtrée (Electron, pour photographier le guide)
        working-directory: outils/desktop
        run: npm ci

      - name: Mode d'emploi (captures de l'application, puis PDF)
        working-directory: outils/guide
        run: |
          set -euo pipefail
          (cd ../desktop && node prepare-app.js)
          export BLONAY_CHROMIUM="$(cd ../test-e2e && node -p "require('@playwright/test').chromium.executablePath()")"
          xvfb-run -a node faire-le-guide.js "$GITHUB_WORKSPACE/Blonay-PDF-mode-d-emploi.pdf"
          test -s "$GITHUB_WORKSPACE/Blonay-PDF-mode-d-emploi.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: mode-d-emploi
          path: Blonay-PDF-mode-d-emploi.pdf
          retention-days: 7

      # Les quatre autres documents du dossier livré : guide d'administration, fiche de
      # protection des données, fiche produit, procédure de support. Les coordonnées de
      # l'éditeur viennent des variables du dépôt (EDITEUR_*), jamais du code : le dépôt est
      # public. Sans elles, les documents renvoient aux mentions légales du site.
      - name: Documents (administration, protection des données, fiche produit, support)
        working-directory: outils/docs
        env:
          EDITEUR_NOM: ${{ vars.EDITEUR_NOM }}
          EDITEUR_RUE: ${{ vars.EDITEUR_RUE }}
          EDITEUR_NUMERO: ${{ vars.EDITEUR_NUMERO }}
          EDITEUR_NPA: ${{ vars.EDITEUR_NPA }}
          EDITEUR_LOCALITE: ${{ vars.EDITEUR_LOCALITE }}
          EDITEUR_TELEPHONE: ${{ vars.EDITEUR_TELEPHONE }}
          EDITEUR_EMAIL: ${{ vars.EDITEUR_EMAIL }}
          EDITEUR_EMAIL_SUPPORT: ${{ vars.EDITEUR_EMAIL_SUPPORT }}
        run: |
          set -euo pipefail
          export BLONAY_CHROMIUM="$(cd ../test-e2e && node -p "require('@playwright/test').chromium.executablePath()")"
          node faire-les-documents.js "$GITHUB_WORKSPACE/documents"
          test "$(ls "$GITHUB_WORKSPACE/documents"/*.pdf | wc -l)" -eq 4

      - uses: actions/upload-artifact@v4
        with:
          name: documents
          path: documents/*.pdf
          retention-days: 7
          if-no-files-found: error

      - name: Rapport (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: outils/test-e2e/playwright-report
          retention-days: 7

  build:
    needs: e2e
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: outils
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dépendances
        run: npm ci

      - name: Bibliothèques de la page (pdf.js, pdf-lib, JSZip, depuis npm)
        run: npm run libs

      - name: Tests unitaires
        run: npm test

      - name: Application autonome (source unique → versions livrées)
        run: npm run build

      - name: Dépendances de l'application fenêtrée
        working-directory: outils/desktop
        run: npm ci

      - name: Empaqueter (Electron, dossier portable)
        working-directory: outils/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - uses: actions/download-artifact@v4
        with:
          name: mode-d-emploi
          path: ${{ github.workspace }}/guide

      - uses: actions/download-artifact@v4
        with:
          name: documents
          path: ${{ github.workspace }}/documents

      - name: Assembler le dossier portable
        working-directory: outils/desktop
        shell: pwsh
        run: |
          Rename-Item dist\win-unpacked BlonayPDF
          # Ce que lit un client : le mode d'emploi, la licence, les composants
          # tiers. Le README du dépôt est une page de développeur, pas un
          # LISEZMOI : il n'a rien à faire dans un dossier livré.
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'guide\Blonay-PDF-mode-d-emploi.pdf') dist\BlonayPDF\Mode-d-emploi.pdf
          New-Item -ItemType Directory -Force -Path dist\BlonayPDF\Documents | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'documents\*.pdf') dist\BlonayPDF\Documents\
          Copy-Item build\LICENCE.txt dist\BlonayPDF\LICENCE.txt
          Copy-Item build\MENTIONS-TIERCES.txt dist\BlonayPDF\MENTIONS-TIERCES.txt
          Copy-Item build\LISEZMOI-portable.txt dist\BlonayPDF\LISEZMOI-portable.txt
          Copy-Item build\Mettre-a-jour.cmd dist\BlonayPDF\Mettre-a-jour.cmd
          # La fiche de version voyage a la racine du dossier : c'est elle que
          # l'application lit dans un zip pose a cote d'elle pour savoir s'il
          # est plus recent que ce qui tourne. Sans elle, la mise a jour ne se
          # proposerait jamais (maj-test.js tombe alors).
          node fiche-de-version.js windows dist\BlonayPDF\version.json
          Copy-Item ..\NOTES-DE-VERSION.md dist\BlonayPDF\Notes-de-version.txt
          Get-ChildItem dist\BlonayPDF | Select-Object Name, Length

      - name: Test de fumée de l'exécutable (fenêtre, menu, ouverture d'un PDF, imprimantes, export)
        timeout-minutes: 14
        working-directory: outils/desktop
        shell: pwsh
        run: |
          node smoke-test.js dist\BlonayPDF\BlonayPDF.exe
          Remove-Item dist\BlonayPDF\data -Recurse -Force -ErrorAction SilentlyContinue

      # Les comptes : deux personnes sur la meme installation, chacune ses
      # tampons. Joue sur l'executable empaquete, parce que le dossier de
      # donnees se fixe au tout debut du demarrage et qu'une erreur la ne se
      # verrait qu'en production.
      #
      # Le dossier d'essai est un dossier local ordinaire : rien ne le fait
      # passer pour un lecteur reseau. C'est le defaut qu'on a corrige — la
      # connexion ne s'ouvrait que sur un partage reconnu, et une installation
      # posee ailleurs ne demandait jamais rien a personne.
      - name: Comptes — la connexion d'abord, puis chacune ses tampons
        timeout-minutes: 14
        working-directory: outils/desktop
        shell: pwsh
        run: node comptes-test.js dist\BlonayPDF\BlonayPDF.exe

      # Deux secrétaires, un fichier sur le lecteur réseau : la seconde à
      # enregistrer écrasait le travail de la première sans un mot, et la
      # fenêtre de la première affichait toujours « Enregistré ». Deux instances
      # de l'exécutable empaqueté sur un même document : verrou, conflit,
      # annulation, écrasement voulu, et aucun verrou qui traîne à la fermeture.
      - name: Écrasement — le travail d'une collègue n'est jamais perdu en silence
        timeout-minutes: 14
        working-directory: outils/desktop
        shell: pwsh
        run: node ecrasement-test.js dist\BlonayPDF\BlonayPDF.exe

      # « Aucune donnée ne quitte le poste » se prouve en regardant, pas en
      # relisant le code. Un mandataire d'observation est posé sur la machine,
      # l'exécutable empaqueté est utilisé pour de bon (ouvrir, tourner,
      # enregistrer, reconnaître le texte d'une image) et le test échoue à la
      # moindre connexion reçue ou à la moindre requête refusée. Il a déjà
      # débusqué un téléchargement de dictionnaire orthographique chez Google.
      - name: Réseau — rien ne sort du poste, observé derrière un mandataire
        timeout-minutes: 14
        working-directory: outils/desktop
        shell: pwsh
        run: node reseau-test.js dist\BlonayPDF\BlonayPDF.exe

      # La licence est un fichier signé posé à côté de l'exécutable, et un essai qui
      # court depuis le premier lancement : joués sur l'exécutable empaqueté, avec des
      # clés d'essai. Une licence falsifiée n'ouvre rien ; un essai fini n'enregistre
      # plus, mais laisse tout lire.
      - name: Licence — essai, licence signée, fichier falsifié, essai terminé
        timeout-minutes: 14
        working-directory: outils/desktop
        shell: pwsh
        run: node licence-test.js dist\BlonayPDF\BlonayPDF.exe

      # Une mise a jour qui se propose a tort reinstalle une version plus
      # ancienne ; lancee pendant qu'une collegue travaille, elle laisse une
      # installation a moitie remplacee. Les quatre cas sont joues sur
      # l'executable empaquete.
      - name: Mise à jour — proposée, refusée quand une collègue travaille, lancée sinon
        timeout-minutes: 14
        working-directory: outils/desktop
        shell: pwsh
        run: |
          node maj-test.js dist\BlonayPDF\BlonayPDF.exe
          Remove-Item dist\BlonayPDF\data -Recurse -Force -ErrorAction SilentlyContinue

      - name: Archive zip
        working-directory: outils/desktop
        shell: pwsh
        run: Compress-Archive -Path dist\BlonayPDF -DestinationPath ..\..\BlonayPDF-windows.zip

      # Les zips des tests sont ecrits a la main. Celui-ci vient de
      # Compress-Archive : c'est la seule preuve que le lecteur de zip tient
      # devant l'archive que les gens telechargeront vraiment.
      # Le script node est dans une chaine PowerShell a guillemets doubles :
      # pas d'apostrophe dedans, elle y serait rendue telle quelle et couperait
      # la chaine JavaScript en deux.
      - name: La fiche de version se lit dans l'archive
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'BlonayPDF-windows.zip'
          $mod = Join-Path $env:GITHUB_WORKSPACE 'outils\desktop\version-posee.js'
          $lu = node -e "const v = require(process.argv[1]).ficheDuZip(process.argv[2]); if (!v || !v.commit || !v.date) { console.error('fiche de version illisible dans le zip'); process.exit(1); } console.log(v.commit + ' du ' + v.date);" $mod $zip
          if ($LASTEXITCODE -ne 0) { throw "La fiche de version ne se lit pas dans l'archive." }
          Write-Host "  fiche lue dans l'archive : $lu"

      # Le script de mise a jour est la seule chose du depot qui touche a
      # l'installation de quelqu'un. Il est donc joue pour de vrai, sur Windows :
      # un faux dossier deja installe — une vraie copie de l'application, car c'est
      # elle qui verifie la signature —, avec des donnees dedans, recoit le zip
      # fraichement construit. Ce qui compte : data survit, les fichiers sont
      # remplaces, un fichier personnel pose dans le dossier reste la ... et une
      # archive qui n'est pas signee par l'editeur n'est jamais installee.
      # Les cles sont des cles d'essai, jetables : l'application construite ici ne
      # connait pas encore (ou pas du tout) celles de l'editeur.
      - name: Le script de mise à jour préserve les données, et refuse ce qui n'est pas signé
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Capture fidèle : sans cela, les accents du script reviendraient
          # abîmés par la console et la vérification ne voudrait rien dire.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $ws = $env:GITHUB_WORKSPACE
          $dit = { param($quoi, $vrai) if (-not $vrai) { throw "RATÉ : $quoi" }; Write-Host "  ok - $quoi" }

          # La paire d'essai : l'application et la signature la connaissent par l'environnement.
          $pem = Join-Path $env:RUNNER_TEMP 'essai.pem'
          $env:BLONAY_CLES_PUBLIQUES_ESSAI = node (Join-Path $ws 'outils\editeur\paire-essai.js') $pem
          $zip = Join-Path $env:RUNNER_TEMP 'maj\BlonayPDF-windows.zip'
          New-Item -ItemType Directory -Force -Path (Split-Path $zip) | Out-Null
          Copy-Item (Join-Path $ws 'BlonayPDF-windows.zip') $zip
          node (Join-Path $ws 'outils\editeur\signer-maj.js') $zip --cle $pem --plateforme windows --version 99.0.0 --canal stable --commit essai --date 2099-01-01T00:00:00Z
          if ($LASTEXITCODE -ne 0) { throw "La signature d'essai a échoué." }

          # Un faux dossier installé : la vraie application, une ancienne fiche de version, des données.
          $poste = Join-Path $env:RUNNER_TEMP 'poste'
          Copy-Item -Recurse (Join-Path $ws 'outils\desktop\dist\BlonayPDF') $poste
          Remove-Item (Join-Path $poste 'data') -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $poste 'data\recuperation') | Out-Null
          Set-Content (Join-Path $poste 'data\tampons.json') 'MES TAMPONS'
          Set-Content (Join-Path $poste 'data\recuperation\a.json') 'MON TRAVAIL'
          Set-Content (Join-Path $poste 'notes-du-service.txt') 'A MOI'
          Set-Content (Join-Path $poste 'version.json') '{"version":"0.0.1","commit":"ancien","date":"2020-01-01T00:00:00Z"}'
          Remove-Item (Join-Path $poste 'LISEZMOI-portable.txt') -Force
          Copy-Item (Join-Path $ws 'outils\desktop\build\Mettre-a-jour.cmd') $poste -Force

          # 1. Une archive NON signée est refusée, et rien n'est touché.
          $nue = Join-Path $env:RUNNER_TEMP 'nue\BlonayPDF-windows.zip'
          New-Item -ItemType Directory -Force -Path (Split-Path $nue) | Out-Null
          Copy-Item $zip $nue
          $sortie = & cmd.exe /c "`"$poste\Mettre-a-jour.cmd`" `"$nue`" < NUL" 2>&1 | Out-String
          Write-Host $sortie
          & $dit 'une archive sans signature est refusée' ($sortie -match 'n''est pas signée')
          & $dit 'et rien n''a été touché' (-not (Test-Path (Join-Path $poste 'LISEZMOI-portable.txt')))
          & $dit 'la fiche de version est restée l''ancienne' ((Get-Content (Join-Path $poste 'version.json') -Raw) -match '0\.0\.1')

          # 2. Une archive signée, puis modifiée d'un octet, est refusée.
          $falsifiee = Join-Path $env:RUNNER_TEMP 'falsifiee\BlonayPDF-windows.zip'
          New-Item -ItemType Directory -Force -Path (Split-Path $falsifiee) | Out-Null
          Copy-Item $zip $falsifiee; Copy-Item "$zip.signature.json" "$falsifiee.signature.json"
          $o = [System.IO.File]::ReadAllBytes($falsifiee); $o[$o.Length - 40] = $o[$o.Length - 40] -bxor 1; [System.IO.File]::WriteAllBytes($falsifiee, $o)
          $sortie = & cmd.exe /c "`"$poste\Mettre-a-jour.cmd`" `"$falsifiee`" < NUL" 2>&1 | Out-String
          & $dit 'une archive modifiée après sa signature est refusée' ($sortie -match 'n''est pas signée')
          & $dit 'et rien n''a été touché non plus' (-not (Test-Path (Join-Path $poste 'LISEZMOI-portable.txt')))

          # 3. L'archive signée s'installe, les données restent.
          $sortie = & cmd.exe /c "`"$poste\Mettre-a-jour.cmd`" `"$zip`" < NUL" 2>&1 | Out-String
          Write-Host $sortie
          & $dit 'la signature de l''éditeur est vérifiée par l''application déjà installée' ($sortie -match 'Signature vérifiée')
          & $dit 'le script est allé au bout' ($sortie -match 'BLONAY-MAJ: OK')
          & $dit 'les accents ressortent intacts' ($sortie -match 'Mise à jour terminée')
          & $dit 'les tampons sont conservés' ((Get-Content (Join-Path $poste 'data\tampons.json')) -eq 'MES TAMPONS')
          & $dit 'le travail mis de côté est conservé' ((Get-Content (Join-Path $poste 'data\recuperation\a.json')) -eq 'MON TRAVAIL')
          & $dit 'un fichier personnel du dossier est conservé' ((Get-Content (Join-Path $poste 'notes-du-service.txt')) -eq 'A MOI')
          & $dit 'les fichiers de la nouvelle version sont arrivés' (Test-Path (Join-Path $poste 'LISEZMOI-portable.txt'))
          & $dit 'la fiche de version est celle de la nouvelle' (-not ((Get-Content (Join-Path $poste 'version.json') -Raw) -match '0\.0\.1'))
          & $dit 'le script s''est mis à jour lui-même' (Test-Path (Join-Path $poste 'Mettre-a-jour.cmd'))

          # Lancée par l'application elle-même, la mise à jour ne s'arrête pas sur
          # un « appuyez sur une touche » : elle attend que la fenêtre se ferme,
          # puis rouvre l'application. Sans quoi la personne se retrouverait
          # devant une console, sans son logiciel.
          # Dans un fichier, pas dans un tuyau : l'application que la mise à jour
          # rouvre hériterait de la sortie, et PowerShell attendrait la fermeture
          # du tuyau — donc celle de l'application. Le premier essai y est resté.
          $env:BLONAY_MAJ_AUTO = '1'
          $journal = Join-Path $env:RUNNER_TEMP 'maj-auto.txt'
          cmd.exe /c "`"$poste\Mettre-a-jour.cmd`" `"$zip`" > `"$journal`" 2>&1 < NUL"
          Remove-Item Env:\BLONAY_MAJ_AUTO
          $auto = Get-Content $journal -Raw -Encoding utf8
          Write-Host $auto
          & $dit 'la mise à jour automatique va au bout' ($auto -match 'BLONAY-MAJ: OK')
          & $dit 'elle rouvre l''application au lieu d''attendre une touche' ($auto -match 'Redémarrage de l''application')
          # Elle vient d'ouvrir une fenêtre sur le runner : on la referme.
          Start-Sleep -Seconds 5
          taskkill /F /IM BlonayPDF.exe /T 2>$null | Out-Null
          Start-Sleep -Seconds 2
          Remove-Item Env:\BLONAY_CLES_PUBLIQUES_ESSAI
          Remove-Item -Recurse -Force $poste -ErrorAction SilentlyContinue

      # La preuve d'origine de l'archive : une signature Ed25519, posée à côté
      # (BlonayPDF-windows.zip.signature.json). Les postes n'acceptent une mise à
      # jour posée sur le partage que si elle est signée. Sans la clé privée
      # (secret MAJ_CLE_PRIVEE, voir outils/editeur/generer-cles.js), la
      # construction avertit et continue : l'archive s'installe à la main, mais aucun
      # poste ne la prendra pour une mise à jour.
      - name: Signer l'archive (empreinte SHA-256 et signature de l'éditeur)
        shell: pwsh
        env:
          MAJ_CLE_PRIVEE: ${{ secrets.MAJ_CLE_PRIVEE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'BlonayPDF-windows.zip'
          $fiche = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'outils\desktop\construction.json') -Raw | ConvertFrom-Json
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BlonayPDF-windows.zip" | Set-Content -Encoding ascii "$zip.sha256"
          $critique = @(); if ('${{ inputs.critique }}' -eq 'true') { $critique = @('--critique') }
          node (Join-Path $env:GITHUB_WORKSPACE 'outils\editeur\signer-maj.js') $zip --plateforme windows --version $fiche.version --canal $fiche.canal --commit $fiche.commit --date $fiche.date @critique
          if ($LASTEXITCODE -ne 0) { throw "La signature a échoué." }

      # upload-artifact@v4 ciblent encore Node 20 : le runner les force sur
      # Node 24 et prévient à chaque exécution. Rien n'est cassé aujourd'hui ;
      # à passer au majeur suivant dès qu'il sort.
      - uses: actions/upload-artifact@v4
        with:
          name: BlonayPDF-windows
          path: |
            BlonayPDF-windows.zip
            BlonayPDF-windows.zip.sha256
            BlonayPDF-windows.zip.signature.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # La version Mac. Même application, même code : seul l'emballage change.
  #
  # Construite sur un vrai macOS, parce qu'un paquet .app se signe et se
  # compresse avec les outils du système — un zip fabriqué ailleurs perd les
  # liens symboliques des frameworks, et l'application refuse de s'ouvrir.
  #
  # Binaire universel : le même paquet tourne sur les Mac Intel et sur les Mac
  # à puce Apple. Nous n'avons pas de certificat Apple, donc pas de
  # notarisation : le premier lancement demande un clic droit > Ouvrir, ce que
  # LISEZMOI-mac.txt explique.
  # ---------------------------------------------------------------------------
  mac:
    needs: e2e
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: outils
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dépendances
        run: npm ci

      - name: Bibliothèques de la page (pdf.js, pdf-lib, JSZip, depuis npm)
        run: npm run libs

      - name: Application autonome (source unique → versions livrées)
        run: npm run build

      - name: Dépendances de l'application fenêtrée
        working-directory: outils/desktop
        run: npm ci

      # Le certificat « Developer ID Application », exporté en .p12 puis encodé
      # en base64 dans les secrets du dépôt. Sans lui, la construction continue
      # et signe « ad hoc » : l'application tourne, mais macOS demandera son
      # accord à chaque poste.
      - name: Certificat de signature (s'il est fourni)
        id: certificat
        env:
          P12: ${{ secrets.MAC_CERTIFICAT_P12 }}
          MOT_DE_PASSE: ${{ secrets.MAC_CERTIFICAT_MOT_DE_PASSE }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then
            # Rien poser du tout. Un CSC_LINK vide n'est pas « pas de
            # certificat » pour electron-builder : il le prend pour un chemin,
            # le résout sur le dossier du projet et s'arrête sur « not a file ».
            # C'est ce qui a fait échouer la construction Mac.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "signe=non" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucun certificat Apple : signature ad hoc. macOS demandera l'accord de chaque utilisateur."
            exit 0
          fi
          # Le certificat est posé dans un fichier hors du dépôt : le base64
          # tient sur plusieurs lignes, et une valeur multiligne ne traverse pas
          # l'environnement d'une étape à l'autre.
          fichier="$RUNNER_TEMP/certificat.p12"
          # --decode sur le base64 de GNU, -D sur celui de BSD : selon l'image du
          # runner, c'est l'un ou l'autre.
          printf '%s' "$P12" | base64 --decode > "$fichier" 2>/dev/null \
            || printf '%s' "$P12" | base64 -D > "$fichier" 2>/dev/null \
            || { echo "::error::MAC_CERTIFICAT_P12 n'est pas du base64 : exportez le .p12 puis « base64 -i certificat.p12 | pbcopy »"; exit 1; }
          test -s "$fichier" || { echo "::error::MAC_CERTIFICAT_P12 est vide une fois décodé"; exit 1; }
          echo "CSC_LINK=$fichier" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          # Le mot de passe peut contenir n'importe quoi, y compris un retour à
          # la ligne : il passe par la forme à délimiteur.
          {
            echo "CSC_KEY_PASSWORD<<FIN_DU_MOT_DE_PASSE"
            printf '%s\n' "$MOT_DE_PASSE"
            echo "FIN_DU_MOT_DE_PASSE"
          } >> "$GITHUB_ENV"
          echo "signe=oui" >> "$GITHUB_OUTPUT"
          echo "Certificat fourni : l'application sera signée puis notarisée."

      - name: Empaqueter (Electron, binaire universel)
        working-directory: outils/desktop
        # CSC_LINK, CSC_KEY_PASSWORD et CSC_IDENTITY_AUTO_DISCOVERY viennent de
        # l'étape ci-dessus, qui ne les pose que s'il y a de quoi signer.
        run: npm run dist:mac

      - uses: actions/download-artifact@v4
        with:
          name: mode-d-emploi
          path: ${{ github.workspace }}/guide

      - uses: actions/download-artifact@v4
        with:
          name: documents
          path: ${{ github.workspace }}/documents

      - name: Assembler le dossier
        working-directory: outils/desktop
        run: |
          set -euo pipefail
          # Le dossier de sortie s'appelle mac-universal, mac-arm64 ou mac selon
          # l'architecture : on prend celui qui porte le paquet.
          paquet=$(find dist -maxdepth 2 -name "BlonayPDF.app" -print -quit)
          test -n "$paquet" || { echo "::error::BlonayPDF.app introuvable dans dist/"; exit 1; }
          echo "paquet : $paquet"
          rm -rf dist/BlonayPDF && mkdir -p dist/BlonayPDF
          ditto "$paquet" dist/BlonayPDF/BlonayPDF.app
          # Ce que lit un client : le mode d'emploi, la licence, les composants
          # tiers. Le README du dépôt est une page de développeur.
          cp "$GITHUB_WORKSPACE/guide/Blonay-PDF-mode-d-emploi.pdf" dist/BlonayPDF/Mode-d-emploi.pdf
          mkdir -p dist/BlonayPDF/Documents
          cp "$GITHUB_WORKSPACE"/documents/*.pdf dist/BlonayPDF/Documents/
          cp build/LICENCE.txt dist/BlonayPDF/LICENCE.txt
          cp build/MENTIONS-TIERCES.txt dist/BlonayPDF/MENTIONS-TIERCES.txt
          cp build/LISEZMOI-mac.txt dist/BlonayPDF/LISEZMOI-mac.txt
          cp build/Mettre-a-jour.command dist/BlonayPDF/Mettre-a-jour.command
          chmod +x dist/BlonayPDF/Mettre-a-jour.command
          # La fiche de version voyage à la racine du dossier : c'est elle que
          # l'application lit dans un zip posé à côté d'elle pour savoir s'il est
          # plus récent. Sans elle, la mise à jour ne se proposerait jamais.
          node fiche-de-version.js mac dist/BlonayPDF/version.json
          cp ../NOTES-DE-VERSION.md dist/BlonayPDF/Notes-de-version.txt
          ls -la dist/BlonayPDF

      - name: L'application est bien universelle, et signée
        working-directory: outils/desktop
        run: |
          set -euo pipefail
          paquet=dist/BlonayPDF/BlonayPDF.app
          binaire=$paquet/Contents/MacOS/BlonayPDF
          file "$binaire"
          for arch in x86_64 arm64; do
            lipo -archs "$binaire" | grep -qw "$arch" || { echo "::error::$arch manque : les Mac correspondants ne pourront pas l'ouvrir"; exit 1; }
          done
          echo "architectures : $(lipo -archs "$binaire")"

          # Sans certificat Apple, une signature « ad hoc » — le tiret à la place
          # d'une identité — reste nécessaire : sans elle, un Mac à puce Apple
          # refuse de lancer le paquet, et ce sont toutes les machines vendues
          # depuis 2020. Le lieur en pose une sur le binaire, jamais sur le
          # paquet : c'est à nous de le faire, une fois tout en place.
          if [ "${{ steps.certificat.outputs.signe }}" != "oui" ]; then
            codesign --force --deep --sign - "$paquet"
          fi
          codesign --verify --deep --strict "$paquet" || { echo "::error::le paquet n'est pas signé"; exit 1; }
          codesign -dv "$paquet" 2>&1 | head -6

      - name: Test de fumée de l'application empaquetée
        timeout-minutes: 14
        working-directory: outils/desktop
        run: |
          set -euo pipefail
          node smoke-test.js dist/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF
          rm -rf dist/BlonayPDF/data

      # La remontée du chemin hors du paquet .app est éprouvée à part, dans les
      # tests unitaires (dossierPortable). Ici, c'est le parcours des comptes
      # qu'on rejoue sur l'application empaquetée pour de vrai.
      - name: Comptes — la connexion d'abord, sur l'application empaquetée
        timeout-minutes: 14
        working-directory: outils/desktop
        run: node comptes-test.js dist/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF

      - name: Écrasement — le travail d'une collègue n'est jamais perdu en silence
        timeout-minutes: 14
        working-directory: outils/desktop
        run: node ecrasement-test.js dist/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF

      - name: Réseau — rien ne sort du poste, observé derrière un mandataire
        timeout-minutes: 14
        working-directory: outils/desktop
        run: node reseau-test.js dist/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF

      - name: Licence — essai, licence signée, fichier falsifié, essai terminé
        timeout-minutes: 14
        working-directory: outils/desktop
        run: node licence-test.js dist/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF

      # Notariser, c'est soumettre le paquet à Apple, qui l'analyse et rend un
      # « ticket ». Agrafé au paquet, ce ticket permet à n'importe quel Mac de
      # l'ouvrir sans rien demander, même sans connexion — c'est la seule façon
      # d'éviter le clic droit puis « Ouvrir » sur chaque poste.
      #
      # L'agrafage se fait sur le paquet, avant le zip livré : un ticket posé
      # après ne voyagerait pas avec l'application.
      - name: Notariser chez Apple
        if: steps.certificat.outputs.signe == 'oui'
        working-directory: outils/desktop
        env:
          CLE_API: ${{ secrets.MAC_API_CLE_P8 }}
          CLE_ID: ${{ secrets.MAC_API_CLE_ID }}
          CLE_EMETTEUR: ${{ secrets.MAC_API_EMETTEUR }}
        run: |
          set -euo pipefail
          paquet=dist/BlonayPDF/BlonayPDF.app
          cle="$RUNNER_TEMP/cle-api.p8"
          printf '%s' "$CLE_API" | base64 --decode > "$cle"
          trap 'rm -f "$cle"' EXIT

          # Apple veut une archive, pas un dossier.
          ditto -c -k --keepParent "$paquet" "$RUNNER_TEMP/a-notariser.zip"
          xcrun notarytool submit "$RUNNER_TEMP/a-notariser.zip" \
            --key "$cle" --key-id "$CLE_ID" --issuer "$CLE_EMETTEUR" \
            --wait --timeout 30m

          xcrun stapler staple "$paquet"
          xcrun stapler validate "$paquet" || { echo "::error::le ticket de notarisation n'est pas agrafé"; exit 1; }
          # Le verdict tel que le rendra le Mac d'en face.
          spctl -a -vvv -t exec "$paquet"
          echo "Notarisé et agrafé."

      - name: Archive zip
        working-directory: outils/desktop
        run: |
          set -euo pipefail
          # ditto, et non zip : lui seul préserve les liens symboliques des
          # frameworks et les droits d'exécution. Un zip ordinaire produit une
          # application qui ne s'ouvre pas.
          ditto -c -k --sequesterRsrc --keepParent dist/BlonayPDF "$GITHUB_WORKSPACE/BlonayPDF-mac.zip"
          ls -la "$GITHUB_WORKSPACE/BlonayPDF-mac.zip"

      - name: Le zip se décompresse en une application qui s'ouvre
        run: |
          set -euo pipefail
          essai=$(mktemp -d)
          ditto -x -k "$GITHUB_WORKSPACE/BlonayPDF-mac.zip" "$essai"
          test -x "$essai/BlonayPDF/BlonayPDF.app/Contents/MacOS/BlonayPDF" || { echo "::error::le binaire a perdu son droit d'exécution dans le zip"; exit 1; }
          test -f "$essai/BlonayPDF/version.json" || { echo "::error::la fiche de version manque dans l'archive"; exit 1; }
          test -f "$essai/BlonayPDF/LISEZMOI-mac.txt" || { echo "::error::le LISEZMOI manque"; exit 1; }
          test "$(ls "$essai/BlonayPDF/Documents"/*.pdf | wc -l | tr -d ' ')" -eq 4 || { echo "::error::les quatre documents manquent dans l'archive"; exit 1; }
          test -f "$essai/BlonayPDF/Notes-de-version.txt" || { echo "::error::les notes de version manquent dans l'archive"; exit 1; }
          test -x "$essai/BlonayPDF/Mettre-a-jour.command" || { echo "::error::le script de mise à jour n'est pas exécutable"; exit 1; }
          # Les frameworks d'Electron sont pleins de liens symboliques ; s'ils
          # arrivent en copies, l'application pèse le triple et ne démarre pas.
          liens=$(find "$essai/BlonayPDF/BlonayPDF.app" -type l | wc -l | tr -d " ")
          echo "liens symboliques préservés : $liens"
          test "$liens" -gt 0 || { echo "::error::aucun lien symbolique : le paquet est cassé"; exit 1; }
          codesign --verify --deep "$essai/BlonayPDF/BlonayPDF.app" || { echo "::error::la signature n'a pas survécu au zip"; exit 1; }
          if [ "${{ steps.certificat.outputs.signe }}" = "oui" ]; then
            # C'est ici que se joue la promesse faite à l'utilisateur : une
            # application qui s'ouvre d'un double-clic. On la vérifie sur le zip
            # décompressé, c'est-à-dire sur ce qu'il recevra vraiment.
            xcrun stapler validate "$essai/BlonayPDF/BlonayPDF.app" || { echo "::error::le ticket de notarisation n'a pas survécu au zip"; exit 1; }
            spctl -a -vvv -t exec "$essai/BlonayPDF/BlonayPDF.app" || { echo "::error::macOS refuserait d'ouvrir cette application"; exit 1; }
            echo "Notarisation vérifiée sur l'archive livrée."
          fi
          rm -rf "$essai"

      # Le script de mise à jour Mac est joué pour de vrai, comme celui de Windows :
      # une vraie copie de l'application (c'est elle qui vérifie la signature), de
      # vraies données, une archive signée d'une clé d'essai — et une archive qui ne
      # l'est pas, qui ne doit jamais s'installer.
      - name: Le script de mise à jour (Mac) préserve les données, et refuse ce qui n'est pas signé
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          pem="$RUNNER_TEMP/essai.pem"
          export BLONAY_CLES_PUBLIQUES_ESSAI=$(node "$ws/outils/editeur/paire-essai.js" "$pem")
          mkdir -p "$RUNNER_TEMP/maj"
          zip="$RUNNER_TEMP/maj/BlonayPDF-mac.zip"
          cp "$ws/BlonayPDF-mac.zip" "$zip"
          node "$ws/outils/editeur/signer-maj.js" "$zip" --cle "$pem" --plateforme mac --version 99.0.0 --canal stable --commit essai --date 2099-01-01T00:00:00Z

          poste="$RUNNER_TEMP/poste"
          ditto "$ws/outils/desktop/dist/BlonayPDF" "$poste"
          rm -rf "$poste/data"; mkdir -p "$poste/data/recuperation"
          echo "MES TAMPONS" > "$poste/data/tampons.json"
          echo "MON TRAVAIL" > "$poste/data/recuperation/a.json"
          echo "A MOI" > "$poste/notes-du-service.txt"
          echo '{"version":"0.0.1","commit":"ancien","date":"2020-01-01T00:00:00Z"}' > "$poste/version.json"
          rm -f "$poste/LISEZMOI-mac.txt"
          cp "$ws/outils/desktop/build/Mettre-a-jour.command" "$poste/" && chmod +x "$poste/Mettre-a-jour.command"
          ok() { echo "  ok - $1"; }
          rate() { echo "::error::RATÉ : $1"; exit 1; }

          # Sans signature : refusée, rien n'est touché.
          mkdir -p "$RUNNER_TEMP/nue"; cp "$zip" "$RUNNER_TEMP/nue/BlonayPDF-mac.zip"
          if sortie=$("$poste/Mettre-a-jour.command" "$RUNNER_TEMP/nue/BlonayPDF-mac.zip" < /dev/null 2>&1); then rate "une archive sans signature a été acceptée"; fi
          echo "$sortie"
          echo "$sortie" | grep -q "n'est pas signée" || rate "le refus n'est pas expliqué"
          test ! -f "$poste/LISEZMOI-mac.txt" || rate "une archive refusée a quand même touché au dossier"
          ok "une archive sans signature est refusée, et rien n'est touché"

          # Signée, puis modifiée d'un octet : refusée.
          mkdir -p "$RUNNER_TEMP/falsifiee"; cp "$zip" "$RUNNER_TEMP/falsifiee/BlonayPDF-mac.zip"; cp "$zip.signature.json" "$RUNNER_TEMP/falsifiee/BlonayPDF-mac.zip.signature.json"
          printf 'X' | dd of="$RUNNER_TEMP/falsifiee/BlonayPDF-mac.zip" bs=1 seek=100 conv=notrunc 2>/dev/null
          if "$poste/Mettre-a-jour.command" "$RUNNER_TEMP/falsifiee/BlonayPDF-mac.zip" < /dev/null >/dev/null 2>&1; then rate "une archive modifiée a été acceptée"; fi
          test ! -f "$poste/LISEZMOI-mac.txt" || rate "une archive modifiée a quand même touché au dossier"
          ok "une archive modifiée après sa signature est refusée"

          # Signée : s'installe, les données restent.
          sortie=$("$poste/Mettre-a-jour.command" "$zip" < /dev/null 2>&1) || { echo "$sortie"; rate "la mise à jour d'une archive signée a échoué"; }
          echo "$sortie"
          echo "$sortie" | grep -q "Signature vérifiée" || rate "la signature n'a pas été vérifiée"
          echo "$sortie" | grep -q "BLONAY-MAJ: OK" || rate "le script n'est pas allé au bout"
          test "$(cat "$poste/data/tampons.json")" = "MES TAMPONS" || rate "les tampons ont disparu"
          test "$(cat "$poste/data/recuperation/a.json")" = "MON TRAVAIL" || rate "le travail mis de côté a disparu"
          test "$(cat "$poste/notes-du-service.txt")" = "A MOI" || rate "un fichier personnel a disparu"
          test -f "$poste/LISEZMOI-mac.txt" || rate "les fichiers de la nouvelle version ne sont pas arrivés"
          ok "l'archive signée s'installe, data et fichiers personnels sont conservés"
          rm -rf "$poste"

      # Même preuve d'origine que côté Windows : l'archive est signée, et la
      # signature part avec elle (voir « Signer l'archive » plus haut).
      - name: Signer l'archive (empreinte SHA-256 et signature de l'éditeur)
        env:
          MAJ_CLE_PRIVEE: ${{ secrets.MAJ_CLE_PRIVEE }}
        run: |
          set -euo pipefail
          zip="$GITHUB_WORKSPACE/BlonayPDF-mac.zip"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 BlonayPDF-mac.zip | sed 's|  .*|  BlonayPDF-mac.zip|' > BlonayPDF-mac.zip.sha256
          version=$(node -p "require('./outils/desktop/construction.json').version")
          canal=$(node -p "require('./outils/desktop/construction.json').canal")
          commit=$(node -p "require('./outils/desktop/construction.json').commit")
          date=$(node -p "require('./outils/desktop/construction.json').date")
          critique=""; [ "${{ inputs.critique }}" = "true" ] && critique="--critique"
          node outils/editeur/signer-maj.js "$zip" --plateforme mac --version "$version" --canal "$canal" --commit "$commit" --date "$date" $critique

      - uses: actions/upload-artifact@v4
        with:
          name: BlonayPDF-mac
          path: |
            BlonayPDF-mac.zip
            BlonayPDF-mac.zip.sha256
            BlonayPDF-mac.zip.signature.json
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # La publication : un seul endroit, qui attend que Windows ET Mac soient verts.
  #
  #  - CANDIDATE (toute branche de travail) : deux pré-releases « …-candidate »,
  #    écrasées à chaque construction. À essayer ; jamais ce que les postes
  #    téléchargent par défaut.
  #  - STABLE (étiquette « v2.1.0 », ou lancement manuel « stable ») : une release
  #    numérotée, immuable — v2.1.0 reste téléchargeable quand v2.2.0 sort — avec
  #    ses notes de version, ses deux archives, leurs empreintes et signatures ;
  #    puis les deux pré-releases « …-latest », que les liens des postes visent déjà,
  #    pointent sur elle.
  # ---------------------------------------------------------------------------
  publier:
    needs: [build, mac]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: pose

      - name: Lire la fiche de version
        id: fiche
        run: |
          set -euo pipefail
          ls -la pose/*
          cp outils/NOTES-DE-VERSION.md notes-completes.md
          version=$(node -p "require('./outils/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "canal=$BLONAY_CANAL" >> "$GITHUB_OUTPUT"
          # Les notes de CETTE version : de « ## <version> » au « ## » suivant.
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' outils/NOTES-DE-VERSION.md > notes-version.md
          if [ ! -s notes-version.md ]; then
            echo "::warning::Aucune note pour la version $version dans outils/NOTES-DE-VERSION.md"
            echo "Pas de notes écrites pour cette version." > notes-version.md
          fi

      # Le zip pèse 120 Mo, et son téléversement échoue de temps en temps (« Error
      # saving asset »). On le pose nous-mêmes, en réessayant, et on ne déclare
      # l'étape réussie qu'après avoir revu le fichier en ligne, à la bonne taille.
      - name: Fonctions de publication
        run: |
          cat > publier.sh <<'FONCTIONS'
          # préparer <tag> <titre> <fichier-notes> <stable|candidate>
          preparer() {
            local tag="$1" titre="$2" notes="$3" canal="$4" attente=2 prerelease="--prerelease"
            [ "$canal" = stable ] && prerelease=""
            for essai in 1 2 3 4 5; do
              if gh release view "$tag" >/dev/null 2>&1; then
                if [ "$canal" = stable ]; then gh release edit "$tag" --title "$titre" --notes-file "$notes" --prerelease=false && return 0
                else gh release edit "$tag" --title "$titre" --notes-file "$notes" --prerelease=true && return 0; fi
              else
                gh release create "$tag" --title "$titre" --notes-file "$notes" $prerelease --target "$GITHUB_SHA" && return 0
              fi
              [ "$essai" = 5 ] && { echo "::error::impossible de préparer la release $tag après cinq tentatives"; return 1; }
              echo "Préparation manquée (tentative $essai). Nouvelle tentative dans ${attente}s."; sleep "$attente"; attente=$((attente * 2))
            done
          }
          # poser <tag> <fichier>... : téléverse, puis relit la taille en ligne
          poser() {
            local tag="$1"; shift
            for f in "$@"; do
              local attente=2
              for essai in 1 2 3 4 5; do
                gh release upload "$tag" "$f" --clobber && break
                [ "$essai" = 5 ] && { echo "::error::$f n'a pas pu être posé sur $tag après cinq tentatives"; return 1; }
                echo "Téléversement manqué (tentative $essai). Nouvelle tentative dans ${attente}s."; sleep "$attente"; attente=$((attente * 2))
              done
              local attendu pose; attendu=$(stat -c %s "$f")
              pose=$(gh release view "$tag" --json assets --jq ".assets[] | select(.name == \"$(basename "$f")\") | .size")
              [ -n "$pose" ] || { echo "::error::$tag n'a pas $(basename "$f") : le lien serait mort"; return 1; }
              [ "$pose" = "$attendu" ] || { echo "::error::$(basename "$f") posé à $pose octets au lieu de $attendu"; return 1; }
              echo "posé : $(basename "$f") ($pose octets) sur $tag"
            done
          }
          FONCTIONS

      - name: Publier la version candidate
        if: steps.fiche.outputs.canal == 'candidate'
        run: |
          set -euo pipefail
          . ./publier.sh
          v="${{ steps.fiche.outputs.version }}"
          {
            echo "**CANDIDATE — à essayer avant tout, pas la version des postes.** Construite depuis une branche de travail (${GITHUB_REF_NAME}), commit ${GITHUB_SHA}."
            echo
            echo "Pour installer : l'archive ET son fichier \`.signature.json\`, posés ensemble."
            echo
            cat notes-version.md
          } > notes-candidate.md
          preparer blonaypdf-windows-candidate "Blonay PDF $v — Windows (CANDIDATE, à essayer)" notes-candidate.md candidate
          poser blonaypdf-windows-candidate pose/BlonayPDF-windows/BlonayPDF-windows.zip pose/BlonayPDF-windows/BlonayPDF-windows.zip.sha256 pose/BlonayPDF-windows/BlonayPDF-windows.zip.signature.json
          preparer blonaypdf-mac-candidate "Blonay PDF $v — Mac (CANDIDATE, à essayer)" notes-candidate.md candidate
          poser blonaypdf-mac-candidate pose/BlonayPDF-mac/BlonayPDF-mac.zip pose/BlonayPDF-mac/BlonayPDF-mac.zip.sha256 pose/BlonayPDF-mac/BlonayPDF-mac.zip.signature.json

      - name: Publier la version stable (numérotée, conservée)
        if: steps.fiche.outputs.canal == 'stable'
        run: |
          set -euo pipefail
          . ./publier.sh
          v="${{ steps.fiche.outputs.version }}"
          tag="v$v"
          # Une version publiée ne change plus : si cette étiquette existe déjà avec
          # des archives, on s'arrête plutôt que d'écraser ce que des postes ont déjà.
          if gh release view "$tag" --json assets --jq '.assets | length' 2>/dev/null | grep -qv '^0$'; then
            echo "::error::La release $tag existe déjà et elle est immuable. Montez le numéro de version (outils/package.json) et ses notes."
            exit 1
          fi
          {
            cat notes-version.md
            echo
            echo "---"
            echo "Archives : \`BlonayPDF-windows.zip\` et \`BlonayPDF-mac.zip\`, chacune avec son \`.sha256\` et sa \`.signature.json\` — à poser ensemble. Construite depuis le commit ${GITHUB_SHA}."
          } > notes-stable.md
          preparer "$tag" "Blonay PDF $v" notes-stable.md stable
          poser "$tag" pose/BlonayPDF-windows/* pose/BlonayPDF-mac/*
          # Les liens que les postes connaissent déjà.
          preparer blonaypdf-windows-latest "Blonay PDF — Windows portable (version $v)" notes-stable.md stable
          poser blonaypdf-windows-latest pose/BlonayPDF-windows/*
          preparer blonaypdf-mac-latest "Blonay PDF — Mac (version $v)" notes-stable.md stable
          poser blonaypdf-mac-latest pose/BlonayPDF-mac/*
          echo "Version $v publiée en stable : $tag, blonaypdf-windows-latest, blonaypdf-mac-latest."
