# Construit l'application Windows portable (Blonay PDF.exe + le fichier HTML
# de secours + LISEZ-MOI) et la publie :
#  - à chaque poussée sur main : en artefact du passage ;
#  - à chaque étiquette v* : en version sur la page Releases, prête à télécharger.
# Rien à installer sur le poste qui construit : Go et Node suffisent, la
# compilation croisée vers Windows se fait depuis Linux.
name: Application Windows portable

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: outils/application/lanceur/go.sum

      - name: Bibliothèques de la page (depuis npm)
        run: sh outils/recuperer-libs.sh

      - name: Pages (source unique → versions livrées)
        run: node outils/build.js

      - name: Outil de pose d'icône
        run: npm install --no-save resedit

      - name: Exécutable Windows
        working-directory: outils/application/lanceur
        run: |
          gzip -9 -c blonay-pdf.html > blonay-pdf.html.gz
          gofmt -l . | grep . && { echo "code à reformater"; exit 1; } || true
          GOOS=windows go vet .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H windowsgui" -o "Blonay PDF.exe" .
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node ../poser-icone.js "Blonay PDF.exe" ../icon.ico
          ls -la "Blonay PDF.exe"

      - name: Vérification de l'exécutable
        working-directory: outils/application/lanceur
        run: |
          # La page complète est bien embarquée, et la fenêtre native aussi.
          node -e '
            const fs=require("fs"),zlib=require("zlib");
            const exe=fs.readFileSync("Blonay PDF.exe");
            let i=exe.indexOf(Buffer.from([0x1f,0x8b,0x08])), ok=false;
            while(i>=0){ try{ const h=zlib.gunzipSync(exe.subarray(i)).toString("utf8"); ok=h.includes("ouvrirAuLancement")&&h.includes("blonayEnregistrerDebut"); break;}catch(e){ i=exe.indexOf(Buffer.from([0x1f,0x8b,0x08]),i+1);} }
            if(!ok||!exe.includes("WebView2Loader")||!exe.includes("GetSaveFileNameW")){ console.error("exécutable incomplet"); process.exit(1); }
            console.log("exécutable complet");'

      - name: Dossier portable
        run: |
          mkdir -p "dist/Blonay PDF"
          cp "outils/application/lanceur/Blonay PDF.exe" "dist/Blonay PDF/"
          cp outils/blonay-pdf-hors-ligne.html "dist/Blonay PDF/Blonay PDF (si les .exe sont bloques).html"
          cp outils/application/lanceur/LISEZ-MOI.txt "dist/Blonay PDF/LISEZ-MOI.txt"
          cd dist && zip -r ../BlonayPDF-windows.zip "Blonay PDF"
          ls -la ../BlonayPDF-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BlonayPDF-windows
          path: BlonayPDF-windows.zip

      - name: Publication (étiquette v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" BlonayPDF-windows.zip \
            --title "Blonay PDF — Windows portable ${GITHUB_REF_NAME}" \
            --notes "Décompressez le zip où vous voulez et double-cliquez sur « Blonay PDF.exe ». Rien à installer. Voir LISEZ-MOI.txt dans l'archive."
