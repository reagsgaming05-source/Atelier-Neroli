name: Image lab

# Paints sample pictures of one episode with a free image model (on the runner, CPU),
# to judge the look before painting every scene. Results go to docs/images-lab/.
# Nothing here is shipped in the app. Runs when this file or scripts/images/ changes.

on:
  push:
    paths:
      - 'scripts/images/lab.py'
      - '.github/workflows/image-lab.yml'

permissions:
  contents: write

concurrency:
  group: image-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install diffusers transformers accelerate safetensors pillow
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sd-turbo-v1
      - run: python scripts/images/lab.py stabilityai/sd-turbo docs/images-lab/sd-turbo
      - name: Commit the pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/images-lab
          git diff --cached --quiet && exit 0
          git commit -q -m "Paint sample pictures"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          exit 1
