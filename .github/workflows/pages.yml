name: Vitrine Aktum PDF (GitHub Pages)

# Publie la copie figée du site de vente à une adresse publique, que n'importe
# qui peut ouvrir sans compte : une commune à qui on envoie le lien, un collègue,
# un téléphone. Ce sont des pages autonomes — ni serveur, ni base de données —
# régénérées par « npm run vitrine » dans site/.
#
# À activer une seule fois : Settings → Pages → Source : « GitHub Actions ».

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "site/vitrine/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, et le dernier gagne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Vérifier que la vitrine est complète
        run: |
          test -f site/vitrine/index.html || { echo "::error::site/vitrine/index.html manquant"; exit 1; }
          pages=$(ls site/vitrine/*.html | wc -l)
          echo "$pages pages à publier"
          test "$pages" -ge 10 || { echo "::error::seulement $pages pages, la vitrine semble incomplète"; exit 1; }
          # Une page qui redemanderait quelque chose au réseau ne tiendrait pas
          # toute seule : c'est tout l'intérêt de la copie figée.
          if grep -l 'src="/_next' site/vitrine/*.html; then
            echo "::error::une page référence encore les fichiers de Next"; exit 1
          fi

      # Pages s'active une fois, par vous (Settings → Pages → Source : « GitHub Actions ») : un jeton de travail ne peut pas le faire à votre
      # place. Tant que ce n'est pas fait, la vitrine n'est pas publiée, et le dit — sans mettre en rouge tout ce qui touche à site/vitrine.
      - name: Pages est-il activé ?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "actif=oui" >> "$GITHUB_OUTPUT"
          else
            echo "actif=non" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages n'est pas activé sur ce dépôt (Settings → Pages → Source : « GitHub Actions ») : la vitrine n'est PAS publiée."
          fi

      - if: steps.pages.outputs.actif == 'oui'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - if: steps.pages.outputs.actif == 'oui'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/vitrine

      - id: deploiement
        if: steps.pages.outputs.actif == 'oui'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
