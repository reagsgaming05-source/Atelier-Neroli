name: Publier la maquette (GitHub Pages)

on:
  push:
    branches: [main, claude/blonay-local-site-subscriptions-iclbva]
    paths:
      - "maquette/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages doit être activé une fois dans Settings → Pages → Source : « GitHub Actions ».
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: maquette
      - id: deployment
        uses: actions/deploy-pages@v4
