name: Compta Blonay – Windows portable

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["caisse-ecoles/**", ".github/workflows/build-caisse-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Une seule construction à la fois : deux exécutions qui se chevauchent publiaient leur zip sur
# la même pré-release et la dernière arrivée n'était pas forcément la plus récente.
concurrency:
  group: compta-blonay-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: caisse-ecoles
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Application autonome (version publique, sans les noms de personnes)
        run: npm run build:public

      - name: Dépendances de l'application fenêtrée
        working-directory: caisse-ecoles/desktop
        run: npm ci

      - name: Empaqueter (Electron, dossier portable)
        working-directory: caisse-ecoles/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Tesseract portable (troisième lecteur) – installateur UB Mannheim extrait avec 7-Zip, modèles français
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-WithRetry([string]$Url, [string]$Out) {
            foreach ($try in 1..5) {
              try { Invoke-WebRequest $Url -OutFile $Out -TimeoutSec 300; return }
              catch { Write-Host "Tentative $try/5 échouée pour $Url : $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $try) }
            }
            throw "Téléchargement impossible : $Url"
          }
          # Dernière version publiée par UB Mannheim (API GitHub authentifiée avec le jeton du
          # workflow : sans lui, les exécuteurs partagés dépassent la limite anonyme -> 403) ;
          # à défaut, une version connue.
          $tag = "v5.4.0.20240606"
          $url = "https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28"; Accept = "application/vnd.github+json" }
          foreach ($try in 1..3) {
            try {
              $rel = Invoke-RestMethod "https://api.github.com/repos/UB-Mannheim/tesseract/releases/latest" -Headers $headers
              $asset = $rel.assets | Where-Object { $_.name -like "*w64*.exe" } | Select-Object -First 1
              if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -like "*.exe" } | Select-Object -First 1 }
              if ($asset) { $tag = $rel.tag_name; $url = $asset.browser_download_url }
              break
            }
            catch { Write-Host "API GitHub, tentative $try/3 : $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $try) }
          }
          Write-Host "Tesseract $tag : $url"
          Get-WithRetry $url tesseract-setup.exe
          7z x tesseract-setup.exe -otesseract-extract -y | Out-Null
          $exe = Get-ChildItem tesseract-extract -Recurse -Filter tesseract.exe | Select-Object -First 1
          if (-not $exe) { throw "tesseract.exe introuvable après extraction" }
          New-Item -ItemType Directory -Force -Path tesseract | Out-Null
          Copy-Item "$($exe.DirectoryName)\*" tesseract -Recurse -Force
          Get-ChildItem tesseract -Directory | Where-Object { $_.Name -like '$PLUGINSDIR' -or $_.Name -eq 'doc' -or $_.Name -eq 'html' -or $_.Name -eq 'tessdata' } | Remove-Item -Recurse -Force
          # modèles : fra = LSTM flottant de tessdata_best (le plus précis) ; fra_leg = modèle combiné
          # (moteur historique + LSTM) de tessdata, pour le moteur historique sur les chiffres
          New-Item -ItemType Directory -Force -Path tesseract\tessdata | Out-Null
          Get-WithRetry "https://github.com/tesseract-ocr/tessdata_best/raw/main/fra.traineddata" "tesseract\tessdata\fra.traineddata"
          Get-WithRetry "https://github.com/tesseract-ocr/tessdata/raw/main/fra.traineddata" "tesseract\tessdata\fra_leg.traineddata"
          & tesseract\tesseract.exe --version
          & tesseract\tesseract.exe --list-langs --tessdata-dir tesseract\tessdata
          "Tesseract $tag — https://github.com/UB-Mannheim/tesseract (Apache 2.0)`nModèles : tessdata_best/fra (fra), tessdata/fra (fra_leg) — https://github.com/tesseract-ocr (Apache 2.0)" | Out-File tesseract\VERSION.txt

      - name: Décompte DGEO (version portable publiée dans la release « windows-latest »)
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        run: |
          # Ce zip est produit par l'autre chaîne (branche de Décompte DGEO) et remplacé sur sa
          # pré-release. Pendant ce remplacement, il est absent quelques minutes : si les deux
          # constructions partent ensemble (deux branches poussées à la suite), celle-ci tombait
          # dans le trou et échouait. On attend donc le temps d'une construction complète.
          $url = "https://github.com/${{ github.repository }}/releases/download/windows-latest/DecompteDGEO-windows.zip"
          $ok = $false
          foreach ($try in 1..12) {
            try { Invoke-WebRequest $url -OutFile decompte.zip -TimeoutSec 600; $ok = $true; break }
            catch {
              Write-Host "Tentative $try/12 : $($_.Exception.Message)"
              if ($try -lt 12) { Write-Host "  (Décompte DGEO est peut-être en cours de republication) nouvel essai dans 60 s"; Start-Sleep -Seconds 60 }
            }
          }
          if (-not $ok) { throw "Décompte DGEO introuvable après 12 tentatives : $url (la construction de sa branche a-t-elle abouti ?)" }
          Expand-Archive decompte.zip -DestinationPath decompte-extract -Force
          $exe = Get-ChildItem decompte-extract -Recurse -Filter DecompteDGEO.exe | Select-Object -First 1
          if (-not $exe) { throw "DecompteDGEO.exe introuvable dans le zip" }
          New-Item -ItemType Directory -Force -Path decompte | Out-Null
          Copy-Item "$($exe.DirectoryName)\*" decompte -Recurse -Force
          Remove-Item decompte\data -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem decompte | Select-Object Name, Length

      - name: Assembler le dossier portable
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        run: |
          Rename-Item dist\win-unpacked ComptaBlonay
          if (-not (Test-Path dist\ComptaBlonay\ComptaBlonay.exe)) { throw "ComptaBlonay.exe introuvable dans le dossier empaqueté" }
          Copy-Item tesseract dist\ComptaBlonay\tesseract -Recurse
          Copy-Item decompte dist\ComptaBlonay\decompte -Recurse
          Copy-Item ..\README.md dist\ComptaBlonay\LISEZMOI.md
          Copy-Item build\LISEZMOI-portable.txt dist\ComptaBlonay\LISEZMOI-portable.txt
          # Installer sur plusieurs PC et les mettre à jour depuis le serveur (voir le LISEZMOI)
          Copy-Item "build\Installer sur ce PC.cmd" dist\ComptaBlonay\
          Copy-Item "build\Compta Blonay.cmd" dist\ComptaBlonay\
          # Ce que le lanceur compare pour savoir s'il doit recopier : une construction = une version.
          # Le commit seul ne suffit pas : relancer la construction du même commit (nouvelle version
          # de Décompte DGEO) donne un autre zip.
          "$env:GITHUB_SHA $env:GITHUB_RUN_ID $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))" | Set-Content dist\ComptaBlonay\version.txt
          Get-Content dist\ComptaBlonay\version.txt
          Get-ChildItem dist\ComptaBlonay | Select-Object Name, Length

      - name: Installer sur un PC et mettre à jour depuis le serveur (lanceur)
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Le lanceur recopie le programme du serveur sur le poste. Ses erreurs ne se voient qu'une
          # fois chez les collègues — un poste qui ne démarre plus, ou deux versions mélangées. On
          # l'éprouve donc ici, sous Windows, avant toute publication. Un « programme » miniature
          # suffit : le lanceur ne regarde que des fichiers, il ne démarre rien (COMPTA_SANS_LANCER).
          $ErrorActionPreference = 'Stop'
          $t = Join-Path $env:RUNNER_TEMP 'lanceur'
          $srv = Join-Path $t 'serveur\ComptaBlonay'
          $poste = Join-Path $t 'poste'
          New-Item -ItemType Directory -Force $srv, $poste, "$srv\resources", "$srv\decompte\_internal\pkg\data" | Out-Null
          Copy-Item "build\Installer sur ce PC.cmd", "build\Compta Blonay.cmd" $srv
          Set-Content "$srv\ComptaBlonay.exe" 'v1'
          Set-Content "$srv\version.txt" 'v1'
          Set-Content "$srv\resources\app.txt" 'v1'
          Set-Content "$srv\ancien.txt" 'disparait en v2'
          # un sous-dossier « data » PROFOND fait partie du programme : il doit suivre
          Set-Content "$srv\decompte\_internal\pkg\data\modele.txt" 'v1'
          $env:LOCALAPPDATA = $poste
          $env:COMPTA_SANS_LANCER = '1'
          $env:COMPTA_SANS_RACCOURCI = '1'
          $ici = Join-Path $poste 'ComptaBlonay'
          $lanceur = Join-Path $poste 'ComptaBlonay-lanceur.cmd'
          function Lire($f) { (Get-Content $f -Raw).Trim() }
          function Verifier($ok, $quoi) { if (-not $ok) { throw "LANCEUR : $quoi" }; Write-Host "ok - $quoi" }
          function Lancer() { cmd /c "`"$lanceur`""; if ($LASTEXITCODE -ne 0) { throw "le lanceur a échoué (code $LASTEXITCODE)" } }

          # 1. l'installation, depuis le dossier du serveur
          cmd /c "`"$srv\Installer sur ce PC.cmd`""
          Verifier ($LASTEXITCODE -eq 0) 'installation sans erreur'
          Verifier (Test-Path "$ici\ComptaBlonay.exe") 'programme copié sur le poste'
          Verifier ((Lire "$ici\version.txt") -eq 'v1') 'version notée'
          Verifier ((Lire "$poste\ComptaBlonay-serveur.txt") -eq $srv) 'adresse du serveur retenue'
          Verifier (Test-Path $lanceur) 'lanceur posé hors du dossier du programme'
          Verifier (Test-Path "$ici\decompte\_internal\pkg\data\modele.txt") 'un sous-dossier « data » profond est bien copié'
          # le profil du poste (data\ à côté du programme) : jamais touché
          New-Item -ItemType Directory "$ici\data" | Out-Null
          Set-Content "$ici\data\caisse.log" 'journal du poste'

          # 2. rien de neuf sur le serveur : rien n'est recopié (une retouche locale survit)
          Set-Content "$ici\resources\app.txt" 'retouche locale'
          Lancer
          Verifier ((Lire "$ici\resources\app.txt") -eq 'retouche locale') 'même version : aucune copie, démarrage immédiat'

          # 3. une nouvelle version posée sur le serveur
          Set-Content "$srv\version.txt" 'v2'
          Set-Content "$srv\resources\app.txt" 'v2'
          Remove-Item "$srv\ancien.txt"
          Set-Content "$srv\donnees.txt" '\\SERVEUR\Partage\ComptaBlonay-donnees'
          Lancer
          Verifier ((Lire "$ici\version.txt") -eq 'v2') 'nouvelle version notée'
          Verifier ((Lire "$ici\resources\app.txt") -eq 'v2') 'fichiers mis à jour'
          Verifier (-not (Test-Path "$ici\ancien.txt")) 'un fichier retiré du serveur disparaît du poste'
          Verifier ((Lire "$ici\data\caisse.log") -eq 'journal du poste') 'profil du poste intact'
          Verifier ((Lire "$ici\donnees.txt") -eq '\\SERVEUR\Partage\ComptaBlonay-donnees') 'emplacement des données distribué à tous'

          # 4. donnees.txt retiré du serveur : le poste garde le sien — l'effacer le renverrait sur une caisse à part
          Remove-Item "$srv\donnees.txt"
          Set-Content "$srv\version.txt" 'v3'
          Lancer
          Verifier (Test-Path "$ici\donnees.txt") 'donnees.txt du poste gardé'

          # 5. serveur injoignable : on démarre la version du poste, sans erreur
          Set-Content "$poste\ComptaBlonay-serveur.txt" 'Z:\nulle-part\ComptaBlonay'
          Lancer
          Verifier $true 'serveur injoignable : la version du poste démarre'
          Set-Content "$poste\ComptaBlonay-serveur.txt" $srv

          # 6. l'application déjà ouverte sur ce PC : pas de copie par-dessus des fichiers verrouillés
          Set-Content "$srv\version.txt" 'v4'
          Set-Content "$srv\resources\app.txt" 'v4'
          Copy-Item "$env:WINDIR\System32\PING.EXE" "$t\ComptaBlonay.exe"
          $p = Start-Process "$t\ComptaBlonay.exe" -ArgumentList '-n','120','127.0.0.1' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep 1
            Lancer
            Verifier ((Lire "$ici\resources\app.txt") -eq 'v2') 'déjà ouverte : rien de copié par-dessus'
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep 1
          Lancer
          Verifier ((Lire "$ici\resources\app.txt") -eq 'v4') 'refermée : la mise à jour passe au lancement suivant'

          # 7. deux lancements coup sur coup (double-clic impatient pendant une copie) : le second
          # attend que le premier ait fini. Le verrou est tenu ici par un autre cmd, exactement
          # comme le lanceur le tient — c'est le partage de fichier de cmd lui-même qu'on éprouve.
          Set-Content "$srv\version.txt" 'v5'
          Set-Content "$srv\resources\app.txt" 'v5'
          $verrou = Join-Path $poste 'ComptaBlonay-maj.verrou'
          $tenant = Start-Process cmd -ArgumentList "/c 9>`"$verrou`" ping -n 7 127.0.0.1 >nul" -PassThru -WindowStyle Hidden
          Start-Sleep 1
          $t0 = Get-Date
          Lancer
          $attendu = ((Get-Date) - $t0).TotalSeconds
          $tenant.WaitForExit()
          Verifier ($attendu -ge 3) "copie en cours ailleurs : le lanceur a attendu ($([int]$attendu) s)"
          Verifier ((Lire "$ici\resources\app.txt") -eq 'v5') 'puis il a fait la mise à jour'
          $t0 = Get-Date
          Lancer
          Verifier (((Get-Date) - $t0).TotalSeconds -lt 3) 'le verrou relâché ne fait plus attendre personne'

          # 8. le lanceur se tient lui-même à jour : le corriger ne demande pas de repasser sur chaque PC
          Add-Content "$srv\Compta Blonay.cmd" 'rem lanceur corrigé'
          Set-Content "$srv\version.txt" 'v6'
          Lancer
          Verifier ((Get-FileHash $lanceur).Hash -eq (Get-FileHash "$srv\Compta Blonay.cmd").Hash) 'le lanceur du poste a suivi celui du serveur'
          Lancer
          Verifier $true 'le lanceur remplacé tourne encore'

          # 9. le programme absent du poste et du serveur : un message, pas un plantage
          Remove-Item $ici -Recurse -Force
          Set-Content "$poste\ComptaBlonay-serveur.txt" 'Z:\nulle-part\ComptaBlonay'
          cmd /c "`"$lanceur`""
          Verifier ($LASTEXITCODE -eq 1) 'rien d''installé : le lanceur le dit et s''arrête'

          # 10. comme chez les collègues : « Installer sur ce PC » double-cliqué à une adresse réseau
          # \\SERVEUR\... — cmd refuse alors ce dossier courant et se replace dans C:\Windows —,
          # avec le raccourci sur le bureau. Le partage administratif de la machine tient lieu de serveur.
          $unc = '\\localhost\' + $srv.Substring(0, 1) + '$' + $srv.Substring(2)
          if (Test-Path "$unc\ComptaBlonay.exe") {
            $poste2 = Join-Path $t 'poste2'
            New-Item -ItemType Directory -Force $poste2 | Out-Null
            $env:LOCALAPPDATA = $poste2
            Remove-Item Env:COMPTA_SANS_RACCOURCI
            Push-Location $unc
            try { cmd /c "`"$unc\Installer sur ce PC.cmd`""; $code = $LASTEXITCODE } finally { Pop-Location }
            Verifier ($code -eq 0) 'installation depuis une adresse réseau sans erreur'
            Verifier ((Lire "$poste2\ComptaBlonay-serveur.txt") -eq $unc) 'adresse réseau retenue telle quelle'
            Verifier ((Lire "$poste2\ComptaBlonay\version.txt") -eq 'v6') 'programme copié depuis le réseau'
            $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Compta Blonay.lnk'
            Verifier (Test-Path $lnk) 'raccourci posé sur le bureau'
            $cible = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
            Verifier ($cible -eq (Join-Path $poste2 'ComptaBlonay-lanceur.cmd')) "le raccourci vise le lanceur ($cible)"
            Set-Content "$srv\version.txt" 'v7'
            Set-Content "$srv\resources\app.txt" 'v7'
            Push-Location $env:WINDIR
            try { cmd /c "`"$poste2\ComptaBlonay-lanceur.cmd`""; $code = $LASTEXITCODE } finally { Pop-Location }
            Verifier ($code -eq 0 -and (Lire "$poste2\ComptaBlonay\resources\app.txt") -eq 'v7') 'mise à jour à travers le réseau'
          } else {
            Write-Host "::warning::partage administratif \\localhost indisponible : l'installation depuis une adresse réseau n'a pas été éprouvée"
          }

      - name: Test de fumée de l'exécutable (fenêtre à onglets, saisie d'une pièce, OCR embarqué, Tesseract natif, Décompte DGEO et pont décompte → pièce)
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        env:
          SMOKE_NATIVE: "1"
          SMOKE_DGEO: "1"
        run: |
          try { node smoke-test.js dist\ComptaBlonay\ComptaBlonay.exe }
          finally {
            Get-Content dist\ComptaBlonay\data\caisse.log -ErrorAction SilentlyContinue
            Remove-Item dist\ComptaBlonay\data -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Archive zip
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        run: Compress-Archive -Path dist\ComptaBlonay -DestinationPath ..\..\ComptaBlonay-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ComptaBlonay-windows
          path: ComptaBlonay-windows.zip

      # L'application s'appelait « Caisse écoles » (release caisse-windows-latest) : cette ancienne
      # release et son tag sont retirés pour qu'il n'y ait qu'une version portable publiée.
      # Publication aussi au lancement manuel (workflow_dispatch) : c'est ainsi qu'on refait le zip
      # après une nouvelle version de Décompte DGEO (release « windows-latest »), sans nouveau commit.
      - name: Retirer l'ancienne release « caisse-windows-latest »
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete caisse-windows-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || echo "ancienne release absente"

      - name: Publier la version portable (pré-release « compta-blonay-windows-latest »)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compta-blonay-windows-latest
          name: "Compta Blonay — Windows portable (dernière version)"
          prerelease: true
          body: |
            Compta Blonay, version portable Windows : décompressez le zip, puis double-cliquez sur `ComptaBlonay.exe`.
            Aucune installation, aucun navigateur : tout est inclus. Une seule application pour les deux outils : le menu du logo, en haut de la barre latérale, passe de Caisse écoles (saisie des pièces, pièces scannées, comptage de la caisse, journal, Excel, PDF) à Décompte DGEO (courses d'école & camps, démarré avec l'application et affiché dans la même page, avec le récapitulatif des décomptes). Un décompte terminé est proposé comme pièce DECOMPTE pré-remplie dans la caisse.
            Cette version ne contient aucun nom de personne : posez `vocabulaire-noms.js` (remis séparément) à côté de l'exécutable.
            Construit automatiquement depuis la branche `${{ github.ref_name }}`, commit ${{ github.sha }}.

      # L'envoi du zip (~200 Mo) par l'action échoue par intermittence, et elle supprime l'ancien
      # fichier AVANT d'envoyer le nouveau : la page de téléchargement restait alors vide. « gh »
      # remplace le fichier en place (--clobber) et réessaie.
      - name: Publier le zip sur la pré-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=compta-blonay-windows-latest
          ZIP=ComptaBlonay-windows.zip
          LIEN="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ZIP"
          empreinte=$(sha256sum "$ZIP" | cut -d' ' -f1)
          # Ce qui compte, c'est ce que la personne télécharge : on vérifie le fichier AU BOUT DU
          # LIEN, octet pour octet. Ni la réponse de gh ni la liste de fichiers de la release ne
          # suffisent — vu le 23.09 : gh annonçait « envoyé », et la liste a gardé pendant des
          # dizaines de minutes un fichier déjà effacé.
          servi() { rm -f servi.zip; curl -sSL --fail --retry 2 -o servi.zip "$LIEN" 2>/dev/null && sha256sum servi.zip | cut -d' ' -f1; }
          recreer() {
            # Le fichier fantôme : listé par la release, mais « introuvable » (HTTP 404) dès qu'on veut
            # le remplacer — gh refuse alors tout nouvel envoi. On repart d'une release neuve sur la
            # même étiquette : le lien de téléchargement, qui ne dépend que d'elle, ne change pas.
            titre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
            texte=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY"
            sleep 5
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$titre" --notes "$texte"
          }
          for try in 1 2 3 4 5; do
            # « timeout » : gh peut rester bloqué sans rien téléverser, ce qui mangeait tout le temps du job
            if timeout 300 gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"; then
              for lecture in 1 2 3 4 5 6; do
                sleep 10
                lue=$(servi || true)
                echo "au bout du lien : ${lue:-rien} (attendu : $empreinte)"
                if [ "$lue" = "$empreinte" ]; then
                  echo "zip publié et vérifié (tentative $try)"
                  # L'étiquette « …-latest » doit désigner le commit d'où vient ce zip : l'action ne la
                  # déplace pas, elle restait sur le tout premier commit publié alors que le texte de la
                  # page annonce un commit récent. Seulement une fois le fichier vérifié.
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
                    -f sha="$GITHUB_SHA" -F force=true >/dev/null \
                    || echo "étiquette non déplacée (sans conséquence pour le téléchargement)"
                  exit 0
                fi
              done
            fi
            echo "tentative $try : le lien ne sert pas ce zip — release recréée avant un nouvel envoi"
            recreer || echo "recréation impossible pour l'instant"
            sleep $((15 * try))
          done
          echo "::error::le zip n'a pas pu être publié : le lien de téléchargement ne sert pas le zip de ce commit"
          exit 1
