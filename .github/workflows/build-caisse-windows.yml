name: Caisse écoles – Windows portable

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["caisse-ecoles/**", ".github/workflows/build-caisse-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: caisse-ecoles
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Application autonome (version publique, sans les noms de personnes)
        run: npm run build:public

      - name: Dépendances de l'application fenêtrée
        working-directory: caisse-ecoles/desktop
        run: npm ci

      - name: Empaqueter (Electron, dossier portable)
        working-directory: caisse-ecoles/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Tesseract portable (troisième lecteur) – installateur UB Mannheim extrait avec 7-Zip, modèles français
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        run: |
          function Get-WithRetry([string]$Url, [string]$Out) {
            foreach ($try in 1..5) {
              try { Invoke-WebRequest $Url -OutFile $Out -TimeoutSec 300; return }
              catch { Write-Host "Tentative $try/5 échouée pour $Url : $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $try) }
            }
            throw "Téléchargement impossible : $Url"
          }
          $rel = $null
          foreach ($try in 1..5) {
            try { $rel = Invoke-RestMethod "https://api.github.com/repos/UB-Mannheim/tesseract/releases/latest"; break }
            catch { Write-Host "API GitHub, tentative $try/5 : $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $try) }
          }
          if (-not $rel) { throw "API GitHub injoignable" }
          $asset = $rel.assets | Where-Object { $_.name -like "*w64*.exe" } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -like "*.exe" } | Select-Object -First 1 }
          if (-not $asset) { throw "Installateur Tesseract introuvable dans la release $($rel.tag_name)" }
          Write-Host "Tesseract $($rel.tag_name) : $($asset.browser_download_url)"
          Get-WithRetry $asset.browser_download_url tesseract-setup.exe
          7z x tesseract-setup.exe -otesseract-extract -y | Out-Null
          $exe = Get-ChildItem tesseract-extract -Recurse -Filter tesseract.exe | Select-Object -First 1
          if (-not $exe) { throw "tesseract.exe introuvable après extraction" }
          New-Item -ItemType Directory -Force -Path tesseract | Out-Null
          Copy-Item "$($exe.DirectoryName)\*" tesseract -Recurse -Force
          Get-ChildItem tesseract -Directory | Where-Object { $_.Name -like '$PLUGINSDIR' -or $_.Name -eq 'doc' -or $_.Name -eq 'html' -or $_.Name -eq 'tessdata' } | Remove-Item -Recurse -Force
          # modèles : fra = LSTM flottant de tessdata_best (le plus précis) ; fra_leg = modèle combiné
          # (moteur historique + LSTM) de tessdata, pour le moteur historique sur les chiffres
          New-Item -ItemType Directory -Force -Path tesseract\tessdata | Out-Null
          Get-WithRetry "https://github.com/tesseract-ocr/tessdata_best/raw/main/fra.traineddata" "tesseract\tessdata\fra.traineddata"
          Get-WithRetry "https://github.com/tesseract-ocr/tessdata/raw/main/fra.traineddata" "tesseract\tessdata\fra_leg.traineddata"
          & tesseract\tesseract.exe --version
          & tesseract\tesseract.exe --list-langs --tessdata-dir tesseract\tessdata
          "Tesseract $($rel.tag_name) — https://github.com/UB-Mannheim/tesseract (Apache 2.0)`nModèles : tessdata_best/fra (fra), tessdata/fra (fra_leg) — https://github.com/tesseract-ocr (Apache 2.0)" | Out-File tesseract\VERSION.txt

      - name: Décompte DGEO (version portable publiée dans la release « windows-latest »)
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/windows-latest/DecompteDGEO-windows.zip"
          $ok = $false
          foreach ($try in 1..5) {
            try { Invoke-WebRequest $url -OutFile decompte.zip -TimeoutSec 600; $ok = $true; break }
            catch { Write-Host "Tentative $try/5 : $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $try) }
          }
          if (-not $ok) { throw "Décompte DGEO introuvable : $url (publiez d'abord la release windows-latest)" }
          Expand-Archive decompte.zip -DestinationPath decompte-extract -Force
          $exe = Get-ChildItem decompte-extract -Recurse -Filter DecompteDGEO.exe | Select-Object -First 1
          if (-not $exe) { throw "DecompteDGEO.exe introuvable dans le zip" }
          New-Item -ItemType Directory -Force -Path decompte | Out-Null
          Copy-Item "$($exe.DirectoryName)\*" decompte -Recurse -Force
          Remove-Item decompte\data -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem decompte | Select-Object Name, Length

      - name: Assembler le dossier portable
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        run: |
          Rename-Item dist\win-unpacked CaisseEcoles
          Copy-Item tesseract dist\CaisseEcoles\tesseract -Recurse
          Copy-Item decompte dist\CaisseEcoles\decompte -Recurse
          Copy-Item ..\README.md dist\CaisseEcoles\LISEZMOI.md
          Copy-Item build\LISEZMOI-portable.txt dist\CaisseEcoles\LISEZMOI-portable.txt
          Get-ChildItem dist\CaisseEcoles | Select-Object Name, Length

      - name: Test de fumée de l'exécutable (fenêtre à onglets, saisie d'une pièce, OCR embarqué, Tesseract natif, Décompte DGEO)
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        env:
          SMOKE_NATIVE: "1"
          SMOKE_DGEO: "1"
        run: |
          try { node smoke-test.js dist\CaisseEcoles\CaisseEcoles.exe }
          finally {
            Get-Content dist\CaisseEcoles\data\caisse.log -ErrorAction SilentlyContinue
            Remove-Item dist\CaisseEcoles\data -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Archive zip
        working-directory: caisse-ecoles/desktop
        shell: pwsh
        run: Compress-Archive -Path dist\CaisseEcoles -DestinationPath ..\..\CaisseEcoles-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CaisseEcoles-windows
          path: CaisseEcoles-windows.zip

      - name: Publier la version portable (pré-release « caisse-windows-latest »)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: caisse-windows-latest
          name: "Caisse écoles — Windows portable (dernière version)"
          prerelease: true
          body: |
            Version portable Windows : décompressez le zip, puis double-cliquez sur `CaisseEcoles.exe`.
            Aucune installation, aucun navigateur : tout est inclus. Deux onglets : Caisse écoles (saisie des pièces, pièces scannées, journal, Excel, PDF) et Décompte DGEO (courses d'école & camps).
            Cette version ne contient aucun nom de personne : posez `vocabulaire-noms.js` (remis séparément) à côté de l'exécutable.
            Construit automatiquement depuis le commit ${{ github.sha }}.
          files: CaisseEcoles-windows.zip
