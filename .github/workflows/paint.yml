name: Paint

# Paints the pictures of the stories (scripts/images/prompts/*.json) with a free image model
# on the runner (CPU, no key, no account) and commits them to public/data/paintings/.
# Runs when a prompts file or the script changes. Pictures already painted are kept.

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/images/prompts/**'
      - 'scripts/images/paint.py'
      - '.github/workflows/paint.yml'

permissions:
  contents: write

concurrency:
  group: paint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install diffusers transformers accelerate safetensors pillow
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sd-turbo-v1
      - name: Paint
        run: |
          mkdir -p public/data/paintings
          cat scripts/images/prompts/*.json | python -c "import sys,json,re; d={}; [d.update(json.loads(m)) for m in re.findall(r'\{.*?\}', sys.stdin.read(), re.S)]; json.dump(d, open('all-prompts.json','w'))"
          python scripts/images/paint.py stabilityai/sd-turbo all-prompts.json public/data/paintings
          rm all-prompts.json
      - name: Commit the pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data/paintings
          git diff --cached --quiet && exit 0
          git commit -q -m "Paint the pictures"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          exit 1
