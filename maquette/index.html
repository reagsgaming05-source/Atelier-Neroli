</path></svg></span>Champs détectés automatiquement</li><li class="flex items-start gap-3 text-[15px] text-ink-700"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Réponses centralisées, export en tableau</li><li class="flex items-start gap-3 text-[15px] text-ink-700"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Compatible avec les formulaires existants</li></ul><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 border border-ink-900/15 bg-white text-ink-900 hover:border-ink-900/40 h-12 px-6 text-[15px] mt-8" href="#/fonctionnalites" data-anchor="formulaires">Les formulaires</a></div><div><div class="card overflow-hidden"><div class="flex items-center justify-between border-b border-line px-5 py-3"><p class="text-sm font-semibold text-ink-900">Réponses · Inscription camp de ski</p><span class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-2.5 py-1 text-xs font-semibold text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide ect></svg>46 réponses reçues · champs détectés automatiquement dans le formulaire PDF</div></div></div></div></div></div></section><section class="container-x py-20 lg:py-28"><div class="reveal"><div class="band-brand grid gap-8 rounded-[1.75rem] p-8 text-white sm:p-12 lg:grid-cols-[1.2fr_0.8fr] lg:items-center"><div><p class="eyebrow text-accent-400">Démo interactive</p><h2 class="mt-3 font-display text-[2.25rem] font-semibold leading-tight sm:text-[2.6rem]">Essayez maintenant, avec vos propres PDF.</h2><p class="mt-4 max-w-xl text-[17px] text-white/75">Fusion, réorganisation, extraction, filigrane et numérotation, directement dans votre navigateur. Aucun compte, aucun envoi de fichier.</p><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 bg-white text-brand-800 hover:bg-brand-50 h-12 px-6 text-[15px] mt-8" href="#/demo"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-play lucide-play-circle size-4" aria-hidden="true"><path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"></path><circle cx="12" cy="12" r="10"></circle></svg>Ouvrir la démo</a></div><div class="rounded-2xl border-2 border-dashed border-white/30 p-8 text-center"><p class="font-display text-xl font-semibold">Déposez un PDF ici</p><p class="mt-1 text-sm text-white/60">ou chargez le document d'exemple</p><div class="mx-auto mt-5 flex w-fit gap-2"><span class="h-14 w-11 rounded-md bg-white/90 shadow-card"></span><span class="h-14 w-11 rounded-md bg-white/90 shadow-card"></span><span class="h-14 w-11 rounded-md bg-white/90 shadow-card"></span></div></div></div></div></section><section class="bg-canvas-100"><div class="container-x grid items-center gap-12 py-20 lg:grid-cols-2 lg:gap-20 lg:py-28"><div class="reveal"><div class="band-brand relative overflow-hidden rounded-[1.75rem] p-10 text-white sm:p-14"><p class="eyebrow text-accent-400">Notre conviction</p><p class="mt-4 font-display text-[1.9rem] font-semibold leading-snug sm:text-[2.3rem]">« Un outil PDF pour l'école doit être complet, simple pour tout le monde, et garder les données des élèves là où elles doivent rester : en Suisse. »</p><p class="mt-6 text-xs uppercase tracking-[0.16em] text-white/60">L'équipe Blonay PDF, Blonay</p></div></div><div class="reveal" style="--reveal-delay:100ms"><div class="max-w-2xl"><p class="eyebrow">Pourquoi Blonay PDF</p><h2 class="mt-3 font-display text-[2.25rem] font-semibold leading-[1.05] sm:text-[2.75rem] text-ink-900">Pensé pour l'école vaudoise.</h2><p class="mt-5 text-[17px] leading-relaxed text-ink-500">Écoles obligatoires, gymnases, écoles professionnelles et services de l'État : des utilisateurs pour qui la protection des données et la simplicité ne sont pas négociables.</p></div><ul class="mt-10 space-y-6"><li class="flex gap-5"><span class="mt-1 inline-flex size-8 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check size-4" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></span><div><h3 class="font-semibold text-ink-900">Les données des élèves restent en Suisse</h3><p class="mt-1 text-[15px] leading-relaxed text-ink-500">Traitement et stockage sur des serveurs situés en Suisse, chiffrement de bout en bout, suppression automatique des fichiers temporaires. Conforme à la LPD et à la LPrD vaudoise.</p></div></li><li class="flex gap-5"><span class="mt-1 inline-flex size-8 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check size-4" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></span><div><h3 class="font-semibold text-ink-900">Un seul outil pour tout l'établissement</h3><p class="mt-1 text-[15px] leading-relaxed text-ink-500">Secrétariat, direction, doyens et enseignant·e·s utilisent la même application, dans le navigateur ou sur le poste de travail, avec la connexion unique de l'identité cantonale.</p></div></li><li class="flex gap-5"><span class="mt-1 inline-flex size-8 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check size-4" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></span><div><h3 class="font-semibold text-ink-900">Un prix public, une facture par établissement</h3><p class="mt-1 text-[15px] leading-relaxed text-ink-500">Une licence par établissement, sans plafond de collaborateurs, facturée sur bon de commande. Aucune option payante cachée.</p></div></li></ul><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition l="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x size-3.5" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span class="sr-only">Non</span></span></td></tr><tr class="border-b border-line/70 last:border-b-0"><td class="px-6 py-3.5 text-ink-700">Support en français, horaires scolaires</td><td class="px-4 py-3.5 bg-brand-50/40"><span class="inline-flex items-center gap-1.5 text-success"><span class="inline-flex size-6 items-center justify-center rounded-full bg-success-50"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3.5" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="sr-only">Oui</span></span></td><td class="px-4 py-3.5"><span class="inline-flex items-center gap-1.5 text-accent-600"><span class="inline-flex size-6 items-center justify-center rounded-full bg-accent-100"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minus size-3.5" aria-hidden="true"><path d="M5 12h14"></path></svg></span><span class="text-xs">Partiel</span></span></td><td class="px-4 py-3.5"><span class="inline-flex items-center gap-1.5 text-ink-400"><span class="inline-flex size-6 items-center justify-center rounded-full bg-canvas-200"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x size-3.5" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span class="sr-only">Non</span></span></td></tr><tr class="border-b border-line/70 last:border-b-0"><td class="px-6 py-3.5 text-ink-700">Facturation sur bon de commande</td><td class="px-4 py-3.5 bg-brand-50/40"><span class="inline-flex items-center gap-1.5 text-success"><span class="inline-flex size-6 items-center justify-center rounded-full bg-success-50"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3.5" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="sr-only">Oui</span></span></td><td class="px-4 py-3.5"><span class="inline-flex items-center gap-1.5 text-accent-600"><span class="inline-flex size-6 items-center justify-center rounded-full bg-accent-100"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minus size-3.5" aria-hidden="true"><path d="M5 12h14"></path></svg></span><span class="text-xs">Partiel</span></span></td><td class="px-4 py-3.5"><span class="inline-flex items-center gap-1.5 text-ink-400"><span class="inline-flex size-6 items-center justify-center rounded-full bg-canvas-200"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x size-3.5" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span class="sr-only">Non</span></span></td></tr></tbody></table></div><p class="border-t border-line px-6 py-3 text-xs text-ink-400">Comparatif indicatif établi à partir des offres publiques ; à vérifier avant publication.</p></div></div></div></section><section class="band-brand text-white"><div class="container-x py-20 lg:py-28"><div class="reveal"><div class="max-w-2xl"><p class="eyebrow text-accent-400">Déploiement</p><h2 class="mt-3 font-display text-[2.25rem] font-semibold leading-[1.05] sm:text-[2.75rem] text-white">Un établissement équipé en quatre semaines.</h2><p class="mt-5 text-[17px] leading-relaxed text-white/75">Un accompagnement rodé, de la convention à l'ouverture au corps enseignant.</p></div></div><div class="mt-14"><ol class="relative grid gap-8 md:grid-cols-4 md:gap-6"><span class="absolute left-4 top-3 hidden h-[calc(100%-1.5rem)] w-px bg-white/15 md:left-0 md:top-4 md:h-px md:w-full" aria-hidden="true"></span><li class="relative pl-10 md:pl-0 md:pt-8"><span class="absolute left-2.5 top-1 flex size-3 items-center justify-center rounded-full bg-accent-400 ring-4 ring-brand-900 md:left-0 md:top-2.5" aria-hidden="true"></span><p class="text-xs font-semibold uppercase tracking-[0.16em] text-accent-400">Semaine 1</p><h3 class="mt-2 font-display text-xl font-semibold text-white">Convention et bon de commande</h3><p class="mt-2 text-[15px] leading-relaxed text-white/70">Signature de la convention, contrat de sous-traitance LPD / LPrD, création de l'espace de l'établissement.</p><span class="absolute -top-1 right-0 font-display text-4xl font-semibold text-white/10 md:top-4">01</span></li><li class="relative pl-10 md:pl-0 md:pt-8"><span class="absolute left-2.5 top-1 flex size-3 items-center justify-center rounded-full bg-accent-400 ring-4 ring-brand-900 md:left-0 md:top-2.5" aria-hidden="true"></span><p class="text-xs font-semibold uppercase tracking-[0.16em] text-accent-400">Semaine 2</p><h3 class="mt-2 font-display text-xl font-semibold text-white">Comptes et connexion cantonale</h3><p class="mt-2 text-[15px] leading-relaxed text-white/70">Activation de la connexion unique, import de la liste des collaborateur·trice·s, paramétrage des modèles de l'école.</p><span class="absolute -top-1 right-0 font-display text-4xl font-semibold text-white/10 md:top-4">02</span></li><li class="relative pl-10 md:pl-0 md:pt-8"><span class="absolute left-2.5 top-1 flex size-3 items-center justify-center rounded-full bg-accent-400 ring-4 ring-brand-900 md:left-0 md:top-2.5" aria-hidden="true"></span><p class="text-xs font-semibold uppercase tracking-[0.16em] text-accent-400">Semaine 3</p><h3 class="mt-2 font-display text-xl font-semibold text-white">Formation du secrétariat</h3><p class="mt-2 text-[15px] leading-relaxed text-white/70">Deux heures en visioconférence ou sur place : signatures, formulaires, caviardage, dossiers d'élèves.</p><span class="absolute -top-1 right-0 font-display text-4xl font-semibold text-white/10 md:top-4">03</span></li><li class="relative pl-10 md:pl-0 md:pt-8"><span class="absolute left-2.5 top-1 flex size-3 items-center justify-center rounded-full bg-accent-400 ring-4 ring-brand-900 md:left-0 md:top-2.5" aria-hidden="true"></span><p class="text-xs font-semibold uppercase tracking-[0.16em] text-accent-400">Semaine 4</p><h3 class="mt-2 font-display text-xl font-semibold text-white">Ouverture à tout l'établissement</h3><p class="mt-2 text-[15px] leading-relaxed text-white/70">Accès pour le corps enseignant, guide de démarrage, support aux horaires scolaires.</p><span class="absolute -top-1 right-0 font-display text-4xl font-semibold text-white/10 md:top-4">04</span></li></ol></div></div></section><section class="container-x py-20 lg:py-28"><div class="reveal"><div class="max-w-2xl mx-auto text-center"><p class="eyebrow">Dans les écoles</p><h2 class="mt-3 font-display text-[2.25rem] font-semibold leading-[1.05] sm:text-[2.75rem] text-ink-900">Ce que les établissements retiennent.</h2></div></div><div class="mt-12 grid gap-6 md:grid-cols-3"><div class="reveal"><figure class="card flex h-full flex-col p-8"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-quote size-5 text-accent-500" aria-hidden="true"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path></svg><blockquote class="mt-4 flex-1 text-[17px] leading-relaxed text-ink-900">Les autorisations de sortie signées par les parents reviennent en deux jours au lieu de deux semaines. Le secrétariat a arrêté de courir après les papiers.</blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-line pt-4 text-sm"><span class="flex size-9 items-center justify-center rounded-full bg-brand-900 font-display text-sm font-semibold text-white">C</span><span><span class="block font-semibold text-ink-900">Claire M.</span><span class="block text-ink-500">Secrétaire d'établissement primaire, Riviera</span></span></figcaption></figure></div><div class="reveal" style="--reveal-delay:80ms"><figure class="card flex h-full flex-col p-8"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-quote size-5 text-accent-500" aria-hidden="true"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path></svg><blockquote class="mt-4 flex-1 text-[17px] leading-relaxed text-ink-900">Le caviardage des données d'élèves avant transmission à un service externe est devenu un réflexe : on recherche, on valide, c'est propre.</blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-line pt-4 text-sm"><span class="flex size-9 items-center justify-center rounded-full bg-brand-900 font-display text-sm font-semibold text-white">N</span><span><span class="block font-semibold text-ink-900">Nadia R.</span><span class="block text-ink-500">Doyenne, gymnase vaudois</span></span></figcaption></figure></div><div class="reveal" style="--reveal-delay:160ms"><figure class="card flex h-full flex-col p-8"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-quote size-5 text-accent-500" aria-hidden="true"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"></path></svg><blockquote class="mt-4 flex-1 text-[17px] leading-relaxed text-ink-900">Je corrige les travaux de mes classes directement dans le PDF, sur le poste de l'école comme à la maison. Un seul outil, enfin.</blockquote><figcaption class="mt-6 flex items-center gap-3 border-t border-line pt-4 text-sm"><span class="flex size-9 items-center justify-center rounded-full bg-brand-900 font-display text-sm font-semibold text-white">T</span><span><span class="block font-semibold text-ink-900">Thomas B.</span><span class="block text-ink-500">Enseignant, école professionnelle</span></span></figcaption></figure></div></div></section><section class="bg-canvas-100"><div class="container-x grid gap-12 py-20 lg:grid-cols-[0.8fr_1.2fr] lg:py-28"><div class="max-w-2xl"><p class="eyebrow">Questions fréquentes</p><h2 class="mt-3 font-display text-[2.25rem] font-semibold leading-[1.05] sm:text-[2.75rem] text-ink-900">Tout ce qu'il faut savoir avant de commencer.</h2><p class="mt-5 text-[17px] leading-relaxed text-ink-500">Une autre question ? Écrivez-nous, nous répondons sous 24 h ouvrées.</p></div><div class="divide-y divide-line border-y border-line"><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Qui souscrit : l'enseignant·e ou l'établissement ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Les deux sont possibles. La formule Établissement couvre l'ensemble des collaborateur·trice·s d'une école, sans plafond, et se règle sur facture. La formule Enseignant·e permet à une personne de s'équiper individuellement.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Que deviennent les documents des élèves ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Les fichiers traités en ligne sont chiffrés, hébergés en Suisse et supprimés automatiquement après 24 heures, sauf enregistrement volontaire dans l'espace de l'établissement. L'application de bureau traite les documents localement. Le traitement respecte la LPD et la LPrD vaudoise.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Les élèves peuvent-ils utiliser l'outil ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">La licence Établissement peut être étendue aux élèves du secondaire II pour la remise de travaux et les formulaires, sans compte nominatif pour les mineurs. Parlez-en avec nous lors de la mise en place.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">L'abonnement est-il avec engagement ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Non. L'abonnement se résilie à tout moment depuis l'espace client ; il reste actif jusqu'à la fin de la période déjà réglée, puis s'arrête sans frais.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Puis-je changer de formule ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Oui. Un passage à une formule supérieure est immédiat, avec un crédit au prorata de la période en cours. Un passage à une formule inférieure prend effet à la prochaine échéance.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Les signatures électroniques sont-elles valables juridiquement ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Les signatures simples et avancées conviennent à la grande majorité des contrats. Pour les actes exigeant une signature qualifiée au sens de la SCSE, contactez-nous : nous vous orientons vers un prestataire certifié compatible.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Comment se passe le paiement ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Les particuliers règlent par carte, en ligne. Les établissements et services de l'État peuvent régler sur facture, avec bon de commande et référence interne. Toutes les factures sont disponibles dans l'espace client.</p></details></div></div></section><section class="container-x py-20 lg:py-28"><div class="card grid gap-10 p-8 sm:p-12 lg:grid-cols-[1fr_auto] lg:items-center"><div><p class="eyebrow">Prêt à commencer ?</p><h2 class="mt-3 font-display text-[2.25rem] font-semibold leading-tight text-ink-900">Équipez votre établissement en une semaine.</h2><p class="mt-3 max-w-xl text-[15px] text-ink-500">Souscrivez en ligne ou demandez une démonstration pour votre équipe. Les applications Windows et macOS se téléchargent depuis l'espace client, et la version web est immédiate.</p></div><div class="flex flex-col gap-3 sm:flex-row lg:flex-col"><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 bg-brand-700 text-white hover:bg-brand-800 h-12 px-6 text-[15px]" href="#/tarifs">Souscrire pour un établissement</a><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 border border-ink-900/15 bg-white text-ink-900 hover:border-ink-900/40 h-12 px-6 text-[15px]" href="#/contact?sujet=Demande%20de%20démonstration">Demander une démo</a></div></div></section></main><footer class="border-t border-line bg-canvas-100 print:hidden"><div class="container-x grid gap-12 py-16 md:grid-cols-2 lg:grid-cols-[1.5fr_1fr_1fr_1fr]"><div class="max-w-sm"><a class="group inline-flex items-center gap-2.5 text-brand-800" aria-label="Blonay PDF — accueil" href="#/"><svg viewBox="0 0 40 40" aria-hidden="true" class="size-8 transition-transform duration-300 group-hover:-rotate-6"><path d="M9 4h15l9 9v20a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z" fill="currentColor"></path><path d="M24 4v6a3 3 0 0 0 3 3h6" fill="var(--color-accent-400)"></path><path d="M12 21h16M12 26h16M12 31h10" stroke="white" stroke-width="2.2" stroke-linecap="round"></path></svg><span class="font-display text-[1.4rem] font-bold leading-none tracking-tight">Blonay <span class="text-brand-600">PDF</span></span></a><p class="mt-5 text-[15px] leading-relaxed text-ink-500">Blonay PDF réunit tout ce qu'il faut pour travailler les documents de l'école : éditer, fusionner, convertir, signer, protéger et annoter les PDF, depuis le navigateur ou l'application de bureau. Une alternative complète à Acrobat pour l'État de Vaud et ses établissements scolaires, hébergée en Suisse et conforme à la LPrD.</p><p class="mt-5 text-xs font-semibold uppercase tracking-[0.14em] text-ink-400">Web · Windows · macOS</p></div><div><p class="eyebrow">Produit</p><ul class="mt-4 space-y-2.5 text-[15px]"><li><a class="text-ink-700 transition hover:text-brand-700" href="#/fonctionnalites">Fonctionnalités</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/demo">Démo</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/tarifs">Tarifs</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/securite">Sécurité</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/contact">Contact</a></li></ul></div><div><p class="eyebrow">Espace client</p><ul class="mt-4 space-y-2.5 text-[15px]"><li><a class="text-ink-700 transition hover:text-brand-700" href="#/connexion">Connexion</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/inscription">Créer un compte</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/compte">Mon abonnement</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/compte/factures">Mes factures</a></li></ul></div><div><p class="eyebrow">Entreprise</p><address class="mt-4 space-y-2.5 text-[15px] not-italic text-ink-700"><p>Blonay PDF Sàrl<br>Route de Vevey 12<br>1807 Blonay, VD</p><p><a href="mailto:bonjour@blonaypdf.ch" class="transition hover:text-brand-700">bonjour@blonaypdf.ch</a></p><p><a href="https://www.linkedin.com/" target="_blank" rel="noreferrer" class="transition hover:text-brand-700">LinkedIn</a></p></address></div></div><div class="border-t border-line"><div class="container-x flex flex-col gap-3 py-6 text-xs text-ink-500 sm:flex-row sm:items-center sm:justify-between"><p>© 2026 Blonay PDF Sàrl · Blonay, Suisse</p><ul class="flex flex-wrap gap-x-5 gap-y-2"><li><a class="transition hover:text-brand-700" href="#/mentions-legales">Mentions légales</a></li><li><a class="transition hover:text-brand-700" href="#/cgv">Conditions générales</a></li><li><a class="transition hover:text-brand-700" href="#/confidentialite">Confidentialité</a></li></ul></div></div></footer></template>
<template data-route="/fonctionnalites" data-title="Fonctionnalités · Blonay PDF"><div hidden=""></div><header class="sticky top-0 z-40 border-b border-line/80 bg-canvas-50/85 backdrop-blur-md print:hidden"><div class="container-x flex h-[72px] items-center justify-between gap-6"><a class="group inline-flex items-center gap-2.5 text-brand-800" aria-label="Blonay PDF — accueil" href="#/"><svg viewBox="0 0 40 40" aria-hidden="true" class="size-8 transition-transform duration-300 group-hover:-rotate-6"><path d="M9 4h15l9 9v20a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z" fill="currentColor"></path><path d="M24 4v6a3 3 0 0 0 3 3h6" fill="var(--color-accent-400)"></path><path d="M12 21h16M12 26h16M12 31h10" stroke="white" stroke-width="2.2" stroke-linecap="round"></path></svg><span class="font-display text-[1.4rem] font-bold leading-none tracking-tight">Blonay <span class="text-brand-600">PDF</span></span></a><nav class="hidden items-center gap-8 lg:flex" aria-label="Navigation principale"><a class="text-[15px] font-medium transition hover:text-brand-700 text-brand-800" href="#/fonctionnalites">Fonctionnalités</a><a class="text-[15px] font-medium transition hover:text-brand-700 text-ink-700" href="#/demo">Démo</a><a class="text-[15px] font-medium transition hover:text-brand-700 text-ink-700" href="#/tarifs">Tarifs</a><a class="text-[15px] font-medium transition hover:text-brand-700 text-ink-700" href="#/securite">Sécurité</a><a class="text-[15px] font-medium transition hover:text-brand-700 text-ink-700" href="#/contact">Contact</a></nav><div class="hidden items-center gap-4 lg:flex"><a class="text-[15px] font-medium text-ink-700 transition hover:text-brand-700" href="#/connexion">Connexion</a><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 bg-brand-700 text-white hover:bg-brand-800 h-10 px-4 text-sm" href="#/tarifs">Commencer</a></div><button type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Ouvrir le menu" class="inline-flex size-11 items-center justify-center rounded-full text-ink-900 transition hover:bg-canvas-200 lg:hidden"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu size-5" aria-hidden="true"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg></button></div></header><main class="flex-1"><section class="border-b border-line bg-canvas-100"><div class="container-x py-16 lg:py-20"><p class="eyebrow">Fonctionnalités</p><h1 class="mt-4 max-w-3xl font-display text-[2.75rem] font-bold leading-[1.02] tracking-tight text-ink-900 sm:text-[3.5rem]">Tout ce qu'un PDF peut demander.</h1><p class="mt-6 max-w-2xl text-lg leading-relaxed text-ink-500">Douze outils dans une seule interface, disponibles dans le navigateur et dans l'application de bureau, pour le secrétariat comme pour la salle des maîtres. Tous les outils sont inclus dans chaque formule.</p></div></section><section class="container-x grid gap-12 py-16 lg:grid-cols-[1fr_320px] lg:py-24"><div class="space-y-16"><div><h2 class="font-display text-[1.75rem] font-semibold text-ink-900">Créer &amp; éditer</h2><div class="mt-6 divide-y divide-line border-y border-line"><article id="editer" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-pen lucide-file-edit size-5" aria-hidden="true"><path d="M12.659 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v9.34"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10.378 12.622a1 1 0 0 1 3 3.003L8.36 20.637a2 2 0 0 1-.854.506l-2.867.837a.5.5 0 0 1-.62-.62l.836-2.869a2 2 0 0 1 .506-.853z"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Éditer le texte et les images</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">L'éditeur reconnaît les blocs de texte, les polices et les images du document. Vous modifiez le contenu comme dans un traitement de texte, avec la mise en page conservée. Les polices manquantes sont remplacées automatiquement par l'équivalent le plus proche.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Texte, images, liens et en-têtes</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Polices et interlignes conservés</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Annuler / rétablir illimité</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-canvas-100 text-ink-500 ring-line">Inclus</span></div></article><article id="formulaires" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-text-cursor-input size-5" aria-hidden="true"><path d="M12 20h-1a2 2 0 0 1-2-2 2 2 0 0 1-2 2H6"></path><path d="M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7"></path><path d="M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1"></path><path d="M6 4h1a2 2 0 0 1 2 2 2 2 0 0 1 2-2h1"></path><path d="M9 6v12"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Créer et remplir des formulaires</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">Ajoutez des champs texte, cases à cocher, listes et signatures en quelques clics. La détection automatique repère les zones à remplir dans les formulaires existants, y compris scannés.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Détection automatique des champs</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Réponses exportées en tableau</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Compatible avec les formulaires Acrobat</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-canvas-100 text-ink-500 ring-line">Inclus</span></div></article><article id="ocr" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scan-text size-5" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 8h8"></path><path d="M7 12h10"></path><path d="M7 16h6"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Reconnaissance de texte (OCR)</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">L'OCR convertit les images de texte en texte réel : vous pouvez ensuite rechercher, copier, éditer ou caviarder. Les documents multilingues sont pris en charge dans un seul passage, avec conservation de la mise en page.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Plus de 30 langues</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Traitement par lots</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Sortie PDF/A pour l'archivage</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-brand-50 text-brand-700 ring-brand-200">Données sensibles</span></div></article></div></div><div><h2 class="font-display text-[1.75rem] font-semibold text-ink-900">Organiser &amp; convertir</h2><div class="mt-6 divide-y divide-line border-y border-line"><article id="organiser" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-grid size-5" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Organiser les pages</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">La vue en vignettes permet de restructurer un document de cent pages en quelques secondes. Vous pouvez extraire une plage de pages vers un nouveau fichier ou insérer des pages venant d'un autre PDF, d'une image ou d'un scan.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Glisser-déposer des vignettes</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Extraction de plages</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Numérotation et filigranes</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-canvas-100 text-ink-500 ring-line">Inclus</span></div></article><article id="fusionner" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-merge size-5" aria-hidden="true"><path d="m8 6 4-4 4 4"></path><path d="M12 2v10.3a4 4 0 0 1-1.172 2.872L4 22"></path><path d="m20 22-5-5"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Fusionner et diviser</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">Fusionnez des PDF, des images et des documents Office dans l'ordre souhaité, avec une table des matières générée automatiquement. La division fonctionne par nombre de pages, par signets ou par taille de fichier.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Fusion de formats mixtes</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Division par signets ou par taille</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Signets et table des matières</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-canvas-100 text-ink-500 ring-line">Inclus</span></div></article><article id="convertir" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left-right size-5" aria-hidden="true"><path d="M8 3 4 7l4 4"></path><path d="M4 7h16"></path><path d="m16 21 4-4-4-4"></path><path d="M20 17H4"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Convertir dans les deux sens</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">La conversion vers Word ou Excel reconstruit les paragraphes, tableaux et styles pour un fichier réellement éditable. Vers PDF, la sortie respecte les normes PDF/A et PDF/X pour l'archivage et l'impression.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Word, Excel, PowerPoint, JPG, PNG, HTML</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>PDF/A (archivage) et PDF/UA (accessibilité)</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Conversion par lots</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-canvas-100 text-ink-500 ring-line">Inclus</span></div></article><article id="compresser" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minimize-2 size-5" aria-hidden="true"><path d="m14 10 7-7"></path><path d="M20 10h-6V4"></path><path d="m3 21 7-7"></path><path d="M4 14h6v6"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Compresser sans perte visible</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">Trois niveaux de compression, avec un aperçu avant/après pour vérifier la qualité des images. Les polices et le texte restent vectoriels, seules les images sont recalculées.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Aperçu avant / après</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Choix de la résolution cible</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Traitement par lots</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-canvas-100 text-ink-500 ring-line">Inclus</span></div></article></div></div><div><h2 class="font-display text-[1.75rem] font-semibold text-ink-900">Signer &amp; protéger</h2><div class="mt-6 divide-y divide-line border-y border-line"><article id="signer" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-signature size-5" aria-hidden="true"><path d="m21 17-2.156-1.868A.5.5 0 0 0 18 15.5v.5a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1c0-2.545-3.991-3.97-8.5-4a1 1 0 0 0 0 5c4.153 0 4.745-11.295 5.708-13.5a2.5 2.5 0 1 1 3.31 3.284"></path><path d="M3 21h18"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Signer électroniquement</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">Envoyez un document à un ou plusieurs signataires, définissez l'ordre de signature et recevez une notification à chaque étape. Chaque signature est horodatée et le certificat d'audit est joint au document final.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Signatures simples et avancées</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Ordre de signature et rappels</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Certificat d'audit joint</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-brand-50 text-brand-700 ring-brand-200">Données sensibles</span></div></article><article id="proteger" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock size-5" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Protéger et chiffrer</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">Définissez un mot de passe d'ouverture et un mot de passe de permissions distincts. Vous contrôlez ce que le destinataire peut faire : imprimer, copier du texte, remplir des champs ou modifier le document.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Chiffrement AES-256</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Permissions détaillées</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Suppression des métadonnées</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-canvas-100 text-ink-500 ring-line">Inclus</span></div></article><article id="caviarder" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off size-5" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Caviarder définitivement</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">Contrairement à un simple rectangle noir, le caviardage retire réellement le contenu du fichier. Recherchez un terme, un numéro AVS ou un IBAN pour caviarder toutes les occurrences en une fois.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Recherche et caviardage en masse</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Motifs prédéfinis (AVS, IBAN, e-mails)</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Rapport de vérification</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-brand-50 text-brand-700 ring-brand-200">Données sensibles</span></div></article></div></div><div><h2 class="font-display text-[1.75rem] font-semibold text-ink-900">Collaborer</h2><div class="mt-6 divide-y divide-line border-y border-line"><article id="annoter" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-highlighter size-5" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"></path><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Annoter et commenter</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">Les annotations sont compatibles avec les autres lecteurs PDF. Partagez un lien de relecture : vos collègues commentent depuis leur navigateur, sans compte, et vous recevez un résumé des retours.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Surlignage, notes, formes, tampons</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Lien de relecture sans compte</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Résumé des commentaires</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-canvas-100 text-ink-500 ring-line">Inclus</span></div></article><article id="comparer" class="grid scroll-mt-28 gap-6 py-8 md:grid-cols-[48px_1fr_auto]"><span class="inline-flex size-12 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-git-compare size-5" aria-hidden="true"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><path d="M11 18H8a2 2 0 0 1-2-2V9"></path></svg></span><div><h3 class="font-display text-[1.4rem] font-semibold text-ink-900">Comparer deux versions</h3><p class="mt-2 text-[15px] leading-relaxed text-ink-500">La comparaison met en évidence les textes ajoutés, supprimés et déplacés, ainsi que les changements de mise en page. Un rapport de synthèse liste les différences, page par page.</p><ul class="mt-4 flex flex-wrap gap-2"><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Différences de texte et de mise en page</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Rapport exportable</li><li class="inline-flex items-center gap-1.5 rounded-full bg-canvas-100 px-3 py-1 text-xs font-medium text-ink-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3 text-brand-600" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Navigation d'une différence à l'autre</li></ul></div><div class="md:text-right"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.7rem] font-semibold uppercase tracking-[0.12em] ring-1 ring-inset bg-brand-50 text-brand-700 ring-brand-200">Données sensibles</span></div></article></div></div></div><aside class="lg:sticky lg:top-24 lg:self-start"><div class="band-brand rounded-[1.5rem] p-8 text-white shadow-soft"><p class="eyebrow text-accent-400">Formules</p><h2 class="mt-3 font-display text-[1.75rem] font-semibold leading-tight">Tous les outils dès CHF 4.90 par mois.</h2><p class="mt-4 text-[15px] leading-relaxed text-white/75">Pour une personne. Une licence Établissement à CHF 149.– par mois couvre tous les collaborateur·trice·s, sans plafond.</p><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 bg-white text-brand-800 hover:bg-brand-50 h-12 px-6 text-[15px] mt-8 w-full" href="#
