ze-3.5" aria-hidden="true"><path d="M5 12h14"></path></svg></span><span class="text-xs">Partiel</span></span></td><td class="px-4 py-3.5"><span class="inline-flex items-center gap-1.5 text-ink-400"><span class="inline-flex size-6 items-center justify-center rounded-full bg-canvas-200"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x size-3.5" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span class="sr-only">Non</span></span></td></tr><tr class="border-b border-line/70 last:border-b-0"><td class="px-6 py-3.5 text-ink-700">Facturation sur bon de commande</td><td class="px-4 py-3.5 bg-brand-50/40"><span class="inline-flex items-center gap-1.5 text-success"><span class="inline-flex size-6 items-center justify-center rounded-full bg-success-50"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3.5" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="sr-only">Oui</span></span></td><td class="px-4 py-3.5"><span class="inline-flex items-center gap-1.5 text-accent-600"><span class="inline-flex size-6 items-center justify-center rounded-full bg-accent-100"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minus size-3.5" aria-hidden="true"><path d="M5 12h14"></path></svg></span><span class="text-xs">Partiel</span></span></td><td class="px-4 py-3.5"><span class="inline-flex items-center gap-1.5 text-ink-400"><span class="inline-flex size-6 items-center justify-center rounded-full bg-canvas-200"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x size-3.5" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span><span class="sr-only">Non</span></span></td></tr></tbody></table></div><p class="border-t border-line px-6 py-3 text-xs text-ink-400">Comparatif indicatif établi à partir des offres publiques ; à vérifier avant publication.</p></div></div></div></section><section><div class="container-x grid gap-12 py-20 lg:grid-cols-2 lg:gap-20"><div class="max-w-2xl"><p class="eyebrow">Dans toutes les formules</p><h2 class="mt-3 font-display text-[2.25rem] font-semibold leading-[1.05] sm:text-[2.75rem] text-ink-900">Ce qui est toujours inclus.</h2><p class="mt-5 text-[17px] leading-relaxed text-ink-500">Enseignant·e ou établissement, le même éditeur complet, sur toutes les plateformes, avec les mises à jour comprises.</p></div><ul class="grid gap-4 sm:grid-cols-2"><li class="flex items-start gap-3 rounded-2xl bg-white p-5 text-[15px] text-ink-700 shadow-card"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Les 12 outils, sans option payante</li><li class="flex items-start gap-3 rounded-2xl bg-white p-5 text-[15px] text-ink-700 shadow-card"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Application web, Windows et macOS avec la même licence</li><li class="flex items-start gap-3 rounded-2xl bg-white p-5 text-[15px] text-ink-700 shadow-card"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Données hébergées en Suisse, conformité LPD et LPrD</li><li class="flex items-start gap-3 rounded-2xl bg-white p-5 text-[15px] text-ink-700 shadow-card"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Mises à jour incluses pendant toute la durée de l'abonnement</li><li class="flex items-start gap-3 rounded-2xl bg-white p-5 text-[15px] text-ink-700 shadow-card"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Résiliation à tout moment, effective à la fin de la période réglée</li><li class="flex items-start gap-3 rounded-2xl bg-white p-5 text-[15px] text-ink-700 shadow-card"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Support en français, aux horaires scolaires</li></ul></div></section><section class="container-x grid gap-12 py-20 lg:grid-cols-[0.8fr_1.2fr] lg:py-28"><div class="max-w-2xl"><p class="eyebrow">Questions fréquentes</p><h2 class="mt-3 font-display text-[2.25rem] font-semibold leading-[1.05] sm:text-[2.75rem] text-ink-900">Avant de vous décider.</h2></div><div class="divide-y divide-line border-y border-line"><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Qui souscrit : l'enseignant·e ou l'établissement ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Les deux sont possibles. La formule Établissement couvre l'ensemble des collaborateur·trice·s d'une école, sans plafond, et se règle sur facture. La formule Enseignant·e permet à une personne de s'équiper individuellement.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Que deviennent les documents des élèves ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Les fichiers traités en ligne sont chiffrés, hébergés en Suisse et supprimés automatiquement après 24 heures, sauf enregistrement volontaire dans l'espace de l'établissement. L'application de bureau traite les documents localement. Le traitement respecte la LPD et la LPrD vaudoise.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Les élèves peuvent-ils utiliser l'outil ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">La licence Établissement peut être étendue aux élèves du secondaire II pour la remise de travaux et les formulaires, sans compte nominatif pour les mineurs. Parlez-en avec nous lors de la mise en place.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">L'abonnement est-il avec engagement ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Non. L'abonnement se résilie à tout moment depuis l'espace client ; il reste actif jusqu'à la fin de la période déjà réglée, puis s'arrête sans frais.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Puis-je changer de formule ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Oui. Un passage à une formule supérieure est immédiat, avec un crédit au prorata de la période en cours. Un passage à une formule inférieure prend effet à la prochaine échéance.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Les signatures électroniques sont-elles valables juridiquement ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Les signatures simples et avancées conviennent à la grande majorité des contrats. Pour les actes exigeant une signature qualifiée au sens de la SCSE, contactez-nous : nous vous orientons vers un prestataire certifié compatible.</p></details><details class="group py-5"><summary class="flex cursor-pointer list-none items-center justify-between gap-6 text-left text-[17px] font-medium text-ink-900 [&amp;::-webkit-details-marker]:hidden">Comment se passe le paiement ?<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0 text-ink-400 transition group-open:rotate-180" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></summary><p class="mt-3 max-w-2xl text-[15px] leading-relaxed text-ink-500">Les particuliers règlent par carte, en ligne. Les établissements et services de l'État peuvent régler sur facture, avec bon de commande et référence interne. Toutes les factures sont disponibles dans l'espace client.</p></details></div></section><section class="container-x pb-20 lg:pb-28"><div class="band-brand rounded-[1.75rem] p-10 text-center text-white shadow-soft sm:p-16"><h2 class="mx-auto max-w-2xl font-display text-[2.25rem] font-semibold leading-tight sm:text-[2.75rem]">Plusieurs établissements, ou tout le canton ?</h2><p class="mx-auto mt-5 max-w-xl text-[17px] text-white/75">Tarif dégressif, déploiement centralisé par la DGEO ou la DGEP, formation des secrétariats et fiche technique pour les marchés publics.</p><div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row"><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 bg-white text-brand-800 hover:bg-brand-50 h-12 px-6 text-[15px]" href="#/contact?sujet=Offre%20cantonale">Demander une offre</a><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 border border-white/40 text-white hover:bg-white/10 h-12 px-6 text-[15px]" href="mailto:bonjour@blonaypdf.ch">bonjour@blonaypdf.ch</a></div></div></section></main><footer class="border-t border-line bg-canvas-100 print:hidden"><div class="container-x grid gap-12 py-16 md:grid-cols-2 lg:grid-cols-[1.5fr_1fr_1fr_1fr]"><div class="max-w-sm"><a class="group inline-flex items-center gap-2.5 text-brand-800" aria-label="Blonay PDF — accueil" href="#/"><svg viewBox="0 0 40 40" aria-hidden="true" class="size-8 transition-transform duration-300 group-hover:-rotate-6"><path d="M9 4h15l9 9v20a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z" fill="currentColor"></path><path d="M24 4v6a3 3 0 0 0 3 3h6" fill="var(--color-accent-400)"></path><path d="M12 21h16M12 26h16M12 31h10" stroke="white" stroke-width="2.2" stroke-linecap="round"></path></svg><span class="font-display text-[1.4rem] font-bold leading-none tracking-tight">Blonay <span class="text-brand-600">PDF</span></span></a><p class="mt-5 text-[15px] leading-relaxed text-ink-500">Blonay PDF réunit tout ce qu'il faut pour travailler les documents de l'école : éditer, fusionner, convertir, signer, protéger et annoter les PDF, depuis le navigateur ou l'application de bureau. Une alternative complète à Acrobat pour l'État de Vaud et ses établissements scolaires, hébergée en Suisse et conforme à la LPrD.</p><p class="mt-5 text-xs font-semibold uppercase tracking-[0.14em] text-ink-400">Web · Windows · macOS</p></div><div><p class="eyebrow">Produit</p><ul class="mt-4 space-y-2.5 text-[15px]"><li><a class="text-ink-700 transition hover:text-brand-700" href="#/fonctionnalites">Fonctionnalités</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/demo">Démo</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/tarifs">Tarifs</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/securite">Sécurité</a></li><li><a class="text-ink-700 transition hover:text-brand-700" href="#/contact">Contact</a></li></ul></div>< ems-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 text-brand-700 hover:bg-brand-50 h-12 px-6 text-[15px]" href="#/confidentialite">Politique de confidentialité</a></div></div><div class="band-brand relative overflow-hidden rounded-[1.75rem] p-8 text-white shadow-soft sm:p-10"><p class="eyebrow text-accent-400">Trajet d'un fichier</p><ol class="mt-6 space-y-5"><li class="flex gap-4"><span class="font-display text-2xl font-semibold text-accent-400">01</span><div><p class="font-semibold">Envoi</p><p class="text-sm text-white/70">Chiffré en TLS 1.3 depuis votre navigateur.</p></div></li><li class="flex gap-4"><span class="font-display text-2xl font-semibold text-accent-400">02</span><div><p class="font-semibold">Traitement</p><p class="text-sm text-white/70">Sur des serveurs en Suisse, dans un espace isolé par client.</p></div></li><li class="flex gap-4"><span class="font-display text-2xl font-semibold text-accent-400">03</span><div><p class="font-semibold">Stockage</p><p class="text-sm text-white/70">AES-256, clés gérées séparément des données.</p></div></li><li class="flex gap-4"><span class="font-display text-2xl font-semibold text-accent-400">04</span><div><p class="font-semibold">Suppression</p><p class="text-sm text-white/70">Automatique après 24 h, ou immédiate sur demande.</p></div></li></ol></div></section><section class="bg-canvas-100"><div class="container-x py-20 lg:py-28"><div class="max-w-2xl"><p class="eyebrow">Nos engagements</p><h2 class="mt-3 font-display text-[2.25rem] font-semibold leading-[1.05] sm:text-[2.75rem] text-ink-900">Six garanties, vérifiables.</h2></div><div class="mt-12 grid gap-6 md:grid-cols-2 xl:grid-cols-3"><div class="card p-8"><span class="inline-flex size-11 items-center justify-center rounded-xl bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" widt compte nominatif rattaché à l'établissement.</p><h3>2.3 Durée et renouvellement</h3><p>L'abonnement débute le jour de la souscription pour une période d'un mois ou d'un an selon la périodicité choisie. Il se renouvelle tacitement pour une période identique, sauf résiliation avant la fin de la période en cours.</p><h3>2.4 Résiliation</h3><p>L'abonnement peut être résilié à tout moment depuis l'espace client. La résiliation prend effet à la fin de la période déjà réglée, sans frais ni pénalité. Aucun remboursement au prorata n'est effectué pour la période en cours. À l'échéance, la licence est désactivée ; les fichiers stockés restent téléchargeables durant 30 jours.</p><h3>2.5 Changement de formule</h3><p>Un passage vers une formule supérieure est immédiat : la période en cours est créditée au prorata et une nouvelle période débute. Un passage vers une formule inférieure prend effet à la prochaine échéance.</p><h2>3. Prix et paiement</h2><p>Les prix sont indiqués en francs suisses (CHF), TVA de 8.1 % incluse. Les particuliers règlent par carte, en ligne, à la souscription puis à chaque renouvellement. Les établissements scolaires et les services de l'État peuvent régler sur facture, à 30 jours, avec bon de commande et référence interne. Une facture est mise à disposition dans l'espace client. En cas de retard de paiement, l'éditeur peut suspendre l'accès après notification et délai de grâce de 30 jours.</p><h2>4. Disponibilité et mises à jour</h2><p>L'éditeur s'efforce d'assurer une disponibilité du service en ligne de 99.5 % par mois, hors maintenance planifiée annoncée au moins 48 heures à l'avance. Les mises à jour du logiciel sont incluses dans l'abonnement.</p><h2>5. Données et fichiers</h2><p>Les fichiers traités en ligne sont chiffrés, hébergés en Suisse et supprimés automatiquement 24 heures après le traitement, sauf enregistrement volontaire dans l'espace de stockage. L'utilisateur reste seul responsable du contenu de ses documents et des droits qui s'y rattachent. Le traitement des données personnelles est décrit dans la politique de confidentialité.</p><h2>6. Signatures électroniques</h2><p>Les signatures produites par le service sont des signatures électroniques simples ou avancées. Il appartient à l'utilisateur de vérifier que ce niveau convient à l'acte concerné. Les actes exigeant une signature électronique qualifiée au sens de la loi fédérale sur la signature électronique (SCSE) nécessitent le recours à un prestataire certifié.</p><h2>7. Usage acceptable</h2><p>Le service ne peut être utilisé pour traiter des contenus illicites, contourner des protections ou porter atteinte aux droits de tiers. L'éditeur se réserve le droit de suspendre un compte en cas d'abus manifeste, après notification.</p><h2>8. Responsabilité</h2><p>L'éditeur répond des dommages causés intentionnellement ou par négligence grave. Pour le surplus, et dans les limites de la loi, sa responsabilité est limitée au montant des abonnements réglés au cours des douze derniers mois. L'utilisateur conserve des copies de ses documents originaux.</p><h2>9. Droit applicable et for</h2><p>Les présentes conditions sont soumises au droit suisse. Tout litige sera soumis aux tribunaux compétents de Vevey (VD), sous réserve des fors impératifs prévus par la loi.</p></div></div></section></main><footer class="border-t border-line bg-canvas-100 print:hidden"><div class="container-x grid gap-12 py-16 md:grid-cols-2 lg:grid-cols-[1.5fr_1fr_1fr_1fr]"><div class="max-w-sm"><a class="group inline-flex items-center gap-2.5 text-brand-800" aria-label="Blonay PDF — accueil" href="#/"><svg viewBox="0 0 40 40" aria-hidden="true" class="size-8 transition-transform duration-300 group-hover:-rotate-6"><path d="M9 4h15l9 9v20a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z" fill="currentColor"></path><path d="M24 4v6a3 3 0 0 0 3 3h6" fill="var(--color-accent-400)"></path><path d="M12 21h16M12 26h16M12 31h10" stroke="white" stroke-width="2.2" stroke-linecap="round"></path></svg tenu des documents.</li><li>Messages envoyés via le formulaire de contact.</li><li>Données techniques strictement nécessaires au fonctionnement du site (cookie de session).</li></ul><h2>Finalités</h2><ul><li>Fournir le service : traitement des documents, licence, synchronisation entre appareils.</li><li>Gérer votre compte, votre abonnement et vos factures.</li><li>Répondre à vos demandes de support.</li><li>Respecter nos obligations légales, notamment comptables.</li></ul><p>Nous n'utilisons aucun outil de suivi publicitaire, ne vendons pas de données et n'entraînons aucun modèle sur vos documents.</p><h2>Hébergement et sous-traitants</h2><p>Les données sont hébergées en Suisse. Les sous-traitants (hébergement, paiement par carte) sont liés par contrat et n'accèdent qu'aux données nécessaires à leur prestation. La liste à jour est disponible sur demande.</p><h2>Durée de conservation</h2><p>Les données de compte sont conservées tant que le compte est actif, puis 30 jours. Les factures sont conservées dix ans conformément aux obligations comptables suisses. Les fichiers non enregistrés sont supprimés après 24 heures ; les fichiers enregistrés le sont 30 jours après la fin de l'abonnement.</p><h2>Cookies</h2><p>Le site utilise un unique cookie technique de session, indispensable à la connexion à votre espace client. Aucun cookie publicitaire ou de mesure d'audience n'est déposé.</p><h2>Vos droits</h2><p>Vous pouvez à tout moment demander l'accès, la rectification, la portabilité ou la suppression de vos données, ou vous opposer à leur traitement, en écrivant à <a href="mailto:bonjour@blonaypdf.ch">bonjour@blonaypdf.ch</a>. Vous pouvez également saisir le Préposé fédéral à la protection des données et à la transparence (PFPDT).</p><h2>Contact</h2><p>Blonay PDF Sàrl, Route de Vevey 12, 1807 Blonay · bonjour@blonaypdf.ch</p></div></div></section></main><footer class="border-t border-line bg-canvas-100 print:hidden"><div class="container-x grid gap-12 py-16 md:grid-cols-2 t="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="text-ink-700">Déploiement centralisé et gestion par la DGEO / DGEP</span></li><li class="flex items-start gap-3 text-[15px]"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="text-ink-700">Formation des secrétariats et référent·e·s</span></li><li class="flex items-start gap-3 text-[15px]"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="text-ink-700">Engagement de disponibilité et support dédié</span></li><li class="flex items-start gap-3 text-[15px]"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="text-ink-700">Hébergement dédié possible</span></li><li class="flex items-start gap-3 text-[15px]"><span class="mt-0.5 inline-flex size-5 shrink-0 items-center justify-center rounded-full bg-brand-50 text-brand-700"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check size-3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="text-ink-700">Fiche technique pour les marchés publics</span></li></ul><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 bg-brand-700 text-white hover:bg-brand-800 h-12 px-6 text-[15px] mt-10 w-full" href="#/contact?sujet=Offre%20cantonale">Demander une offre</a></article></div></template>
<template data-mobile-menu><div id="mobile-menu" class="border-t border-line bg-canvas-50 lg:hidden"><nav class="container-x flex flex-col py-4" aria-label="Navigation mobile"><a class="rounded-xl px-3 py-3 text-base font-medium transition hover:bg-canvas-200 text-ink-700" href="#/fonctionnalites">Fonctionnalités</a><a class="rounded-xl px-3 py-3 text-base font-medium transition hover:bg-canvas-200 text-ink-700" href="#/demo">Démo</a><a class="rounded-xl px-3 py-3 text-base font-medium transition hover:bg-canvas-200 text-ink-700" href="#/tarifs">Tarifs</a><a class="rounded-xl px-3 py-3 text-base font-medium transition hover:bg-canvas-200 text-ink-700" href="#/securite">Sécurité</a><a class="rounded-xl px-3 py-3 text-base font-medium transition hover:bg-canvas-200 text-ink-700" href="#/contact">Contact</a><div class="mt-3 flex flex-col gap-3 border-t border-line pt-4"><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 bg-brand-700 text-white hover:bg-brand-800 h-12 px-6 text-[15px]" href="#/tarifs">Commencer</a><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-full font-semibold transition focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-brand-500/25 disabled:cursor-not-allowed disabled:opacity-60 border border-ink-900/15 bg-white text-ink-900 hover:border-ink-900/40 h-12 px-6 text-[15px]" href="#/connexion">Connexion</a></div></nav></div></template>
<template data-menu-open-icon><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x size-5" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></template>
<script>
(function () {
  var app = document.getElementById("app");
  var routes = {};
  document.querySelectorAll("template[data-route]").forEach(function (t) { routes[t.dataset.route] = t; });
  var yearly = {};
  document.querySelectorAll("template[data-yearly]").forEach(function (t) { yearly[t.dataset.yearly] = t.innerHTML; });
  var menuTpl = document.querySelector("template[data-mobile-menu]").innerHTML;
  var menuOpenIcon = document.querySelector("template[data-menu-open-icon]").innerHTML;
  var pendingAnchor = null;
  var current = "/";

  function go(path) { location.hash = "#" + path; }

  function resolve() {
    var raw = location.hash.replace(/^#/, "") || "/";
    var path = raw; try { path = decodeURIComponent(raw); } catch (e) {}
    if (routes[path]) return path;
    var bare = path.split("?")[0];
    if (routes[bare]) return bare;
    return "/page-inexistante";
  }

  function render() {
    var path = resolve();
    current = path;
    var tpl = routes[path];
    app.innerHTML = tpl.innerHTML;
    document.title = tpl.dataset.title || "Blonay PDF";
    enhance(app);
    if (pendingAnchor) {
      var el = document.getElementById(pendingAnchor);
      pendingAnchor = null;
      if (el) { el.scrollIntoView({ block: "start" }); return; }
    }
    window.scrollTo(0, 0);
  }

  function successBox(text) {
    var d = document.createElement("div");
    d.setAttribute("role", "status");
    d.className = "rounded-xl border border-success-200 bg-success-50 px-4 py-3 text-sm text-success";
    d.textContent = text;
    return d;
  }

  function enhance(root) {
    // Liens avec ancre interne
    root.querySelectorAll("a[data-anchor]").forEach(function (a) {
      a.addEventListener("click", function () { pendingAnchor = a.dataset.anchor; });
    });

    // Menu mobile
    var menuBtn = root.querySelector("button[aria-controls=mobile-menu]");
    if (menuBtn) {
      var closedIcon = menuBtn.innerHTML;
      menuBtn.addEventListener("click", function () {
        var header = menuBtn.closest("header");
        var open = header.querySelector("#mobile-menu");
        if (open) { open.remove(); menuBtn.innerHTML = closedIcon; menuBtn.setAttribute("aria-expanded", "false"); }
        else { header.insertAdjacentHTML("beforeend", menuTpl); menuBtn.innerHTML = menuOpenIcon; menuBtn.setAttribute("aria-expanded", "true"); }
      });
    }

    // Bascule mensuel / annuel
    var group = root.querySelector("[role=radiogroup]");
    if (group && yearly[current.split("?")[0]]) {
      var box = group.parentElement.parentElement;
      if (!box.dataset.monthly) box.dataset.monthly = box.innerHTML;
      group.querySelectorAll("[role=radio]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var isYear = /Annuel/.test(btn.textContent);
          box.innerHTML = isYear ? yearly[current.split("?")[0]] : box.dataset.monthly;
          enhance(box);
        });
      });
    }

    // Cartes de test (souscription)
    root.querySelectorAll("button").forEach(function (btn) {
      var t = btn.textContent.trim();
      if (/^Carte (acceptée|refusée)/.test(t)) {
        btn.addEventListener("click", function () {
          var digits = t.replace(/^Carte (acceptée|refusée)\s*·\s*/, "");
          var holder = root.querySelector("#holder"); if (holder && !holder.value) holder.value = "Marie Dupont";
          var n = root.querySelector("#number"); if (n) n.value = digits;
          var e = root.querySelector("#expiry"); if (e) e.value = "12/30";
          var c = root.querySelector("#cvc"); if (c) c.value = "123";
        });
      }
      if (/^Imprimer/.test(t)) btn.addEventListener("click", function () { window.print(); });
      if (/^Marquer/.test(t)) btn.addEventListener("click", function (ev) {
        ev.preventDefault();
        btn.textContent = t === "Marquer comme lu" ? "Marquer non lu" : "Marquer comme lu";
        var article = btn.closest("article"); if (article) { article.classList.toggle("opacity-80"); var badge = article.querySelector("span.rounded-full"); if (badge && /Nouveau/.test(badge.textContent)) badge.remove(); }
      });
    });

    // Formulaires : simulation des actions serveur
    root.querySelectorAll("form").forEach(function (form) {
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var submit = form.querySelector("button[type=submit], button:not([type])");
        var label = submit ? submit.textContent.trim() : "";
        var plan = form.querySelector("input[name=planSlug]");
        if (plan) { return go("/compte/abonnement?notice=scheduled"); }
        if (/Résilier/.test(label)) { if (window.confirm("Résilier votre abonnement ? Il restera actif jusqu'à la fin de la période réglée, sans nouveau prélèvement.")) go("/compte/abonnement?notice=canceled"); return; }
        if (/Réactiver/.test(label)) return go("/compte/abonnement?notice=resumed");
        if (/Annuler ce changement/.test(label)) return go("/compte/abonnement?notice=change-canceled");
        if (/Confirmer et payer/.test(label)) {
          var number = (form.querySelector("#number") || {}).value || "";
          if (/0002$/.test(number.replace(/\s/g, ""))) { form.querySelectorAll("[role=alert]").forEach(function (x) { x.remove(); }); var err = document.createElement("div"); err.setAttribute("role", "alert"); err.className = "rounded-xl border border-danger/20 bg-danger/5 px-4 py-3 text-sm text-danger"; err.textContent = "Votre carte a été refusée par l'émetteur. Essayez une autre carte."; form.insertBefore(err, form.children[2]); return; }
          return go("/abonnement/confirmation");
        }
        if (/Se connecter/.test(label)) { var email = (form.querySelector("input[name=email]") || {}).value || ""; return go(/^admin/i.test(email) ? "/admin" : "/compte"); }
        if (/Créer mon compte/.test(label)) return go("/compte");
        if (/Se déconnecter/.test(label)) return go("/");
        if (/Envoyer le message/.test(label)) { var wrap = form.parentElement; var card = document.createElement("div"); card.className = "card p-8"; card.appendChild(successBox("Merci, votre message a bien été envoyé. Nous vous répondons sous 24 h ouvrées.")); wrap.replaceChild(card, form); return; }
        form.querySelectorAll("[role=status]").forEach(function (x) { x.remove(); });
        form.insertBefore(successBox(/mot de passe/i.test(label) ? "Votre mot de passe a été modifié." : "Vos informations ont été enregistrées."), form.firstChild);
      });
    });
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
